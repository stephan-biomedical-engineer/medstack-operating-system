# Bring-up overlay for the STM32MP257F-DK. Compose it onto the target profile:
#
#   kas build kas/project-eeg-stm32mp2.yml:kas/bringup-stm32mp2.yml
#   make stm32-bringup
#
# It exists so that project-eeg-stm32mp2.yml keeps saying what the *product*
# should be while the board is being brought up for the first time. Overwriting
# the target's own configuration to make a first boot succeed would leave the
# repository describing a device that was never intended, and nothing would
# record that the difference was temporary.
#
# The delta is one variable. Everything else - the disk, the driver, the
# bootloader, the encryption requirement - is the target configuration
# unchanged, which is the point: a bring-up that quietly disables half the
# platform validates the bring-up and nothing else.
header:
  version: 14

local_conf_header:
  bringup: |
    # The target profile declares "tpm2", which refuses to provision rather
    # than falling back to a weaker key - correct for a product, and it means
    # /data never appears until a TPM is confirmed present on the board and the
    # tpm2 path is implemented. Neither is true yet.
    #
    # "development" now works on this machine, which it did not before:
    # meta-med-bsp declares the key store per machine, so the key goes to
    # bootfs - outside both A/B slots, so a successful update cannot destroy it,
    # and ext4 rather than vfat, so the chmod 0400 actually takes effect.
    #
    # Note what is NOT waived: MED_EEG_REQUIRE_ENCRYPTION stays "true". /data is
    # a real LUKS2 volume on this board with this overlay, so MedicalStorage
    # finds a CRYPT- dm/uuid and the acquisition service is allowed to start.
    # The service starting is still the assertion that encryption is real.
    #
    # Whoever can read the SD card can read this key. That is what makes it a
    # development key, and it is the reason this lives in an overlay whose name
    # says "bringup" rather than in the profile.
    #
    # ":forcevariable" is required, not stylistic, and the plain assignment that
    # was here first is why this comment exists. kas emits local_conf_header
    # blocks **sorted alphabetically by key**, so "bringup" is written to
    # local.conf before "eeg-stm32mp2" - and the profile's
    # MED_DATA_KEY_SOURCE = "tpm2", 86 lines further down, silently won. The
    # build succeeded, the overlay appeared to be applied, and the produced
    # package still said "tpm2"; it was caught by extracting the .ipk and
    # reading the substituted script, not by anything failing.
    #
    # forcevariable is the last entry in bitbake's OVERRIDES, so it wins
    # regardless of where kas decides to write this block. Renaming the key to
    # sort last would also work and would break the next time someone adds a
    # block whose name starts with a later letter.
    MED_DATA_KEY_SOURCE:forcevariable = "development"
