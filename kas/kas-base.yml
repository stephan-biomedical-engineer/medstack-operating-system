header:
  version: 14

distro: med-os

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: "scarthgap"
    path: "layers/poky"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: "scarthgap"
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-rauc:
    url: "https://github.com/rauc/meta-rauc.git"
    branch: "scarthgap"
    path: "layers/meta-rauc"

  # HMI toolkit for the profiles that have an operator display. Any meta-qt6
  # branch from 6.7 onwards declares LAYERSERIES_COMPAT for scarthgap; 6.8 is
  # the Qt LTS. Headless profiles never build anything from it, but the layer
  # has to be present because meta-med-app declares qt6-layer in LAYERDEPENDS.
  meta-qt6:
    url: "https://code.qt.io/yocto/meta-qt6.git"
    branch: "6.8"
    path: "layers/meta-qt6"

  # Order here is cosmetic - bitbake resolves precedence from
  # BBFILE_PRIORITY - but it is written bottom-up to match the MedStack
  # diagram: board adaptation (7), OS policy (8), framework (9), apps (10).
  #
  # meta-med-bsp holds everything that is true of a board rather than of the
  # platform: the .wks layouts and the QEMU boot path. It is the only custom
  # layer permitted to name a machine, a bootloader or a device node, which is
  # what lets the three above it be counted as reused unchanged per board.
  meta-med-bsp:
    path: "meta-custom/meta-med-bsp"

  meta-med-distro:
    path: "meta-custom/meta-med-distro"

  meta-med-framework:
    path: "meta-custom/meta-med-framework"

  meta-med-app:
    path: "meta-custom/meta-med-app"

local_conf_header:
  common: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    SDKMACHINE = "x86_64"
    PATCHRESOLVE = "noop"
    # Weak assignment on purpose. kas forwards DL_DIR and SSTATE_DIR from the
    # environment into bitbake, and kas-container sets both to the paths it
    # bind-mounts (/downloads, /sstate). With "=" here, local.conf would win
    # and the container would write its sstate cache to /sstate-cache - a path
    # inside the ephemeral container filesystem, discarded on every --rm run.
    # With "?=", the environment wins in the container and this default still
    # applies to a native build. See docs/BUILD_CONTAINER.md.
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

  # Note the absence of EXTRA_IMAGE_FEATURES += "debug-tweaks" here. It used to
  # be global, which silently weakened med-image-prod too. Development images
  # (med-image-test, med-image-eeg, med-image-tomograph) now request it
  # themselves, so the hardened image is hardened no matter who builds it.
  metrics: |
    # Raw data for the experimental evaluation: buildstats feeds the build time
    # and footprint metrics, and med-os.conf additionally enables buildhistory
    # and SPDX SBOM generation.
    USER_CLASSES = "buildstats"

  # Disk. Measured, not guessed: a build tree that had produced three images
  # reached 175 GB, of which 152 GB was tmp-glibc/work - the per-recipe working
  # directories (unpacked sources and build trees), which nothing was deleting.
  # It filled a 468 GB disk to 99%.
  disk: |
    # rm_work deletes ${WORKDIR} once a recipe finishes. ${WORKDIR}/temp is kept
    # by the class itself (RM_WORK_EXCLUDE_ITEMS = "temp"), so a failed task's
    # logs survive; the class also flips BB_SCHEDULER to "completion", which
    # finishes recipes rather than spreading them, so peak usage drops too.
    INHERIT += "rm_work"

    # What rm_work costs is the ability to look at what a recipe actually
    # produced, and in this repository that is not a debugging convenience - it
    # is how claims get checked. Two kinds of work directory are therefore kept:
    #
    #   images  - work/<machine>/med-image-*/1.0/rootfs is where the installed
    #             /etc, /boot and unit files are read from. Every "verified by
    #             inspection" statement in RESULTS.md came from there.
    #   kernels - rule 3 says kernel policy goes in a wildcard linux-%.bbappend,
    #             and the only way to confirm a fragment won is to read the
    #             .config the recipe built. That check is currently open: the
    #             fragment asks for CONFIG_TCG_TIS=y and the built config says
    #             "m" (see the TPM note in project-eeg-stm32mp2.yml).
    #
    # Drop entries here if space gets tight again - the kernel ones are the
    # expensive half.
    RM_WORK_EXCLUDE = " \
        med-image-eeg \
        med-image-tomograph \
        med-image-prod \
        med-image-test \
        linux-yocto \
        linux-stm32mp \
    "

    # And a floor, because the failure mode without one is not a failed build:
    # it is a full disk, which takes the desktop session down with it.
    # STOPTASKS stops queueing new tasks and lets the running ones finish;
    # HALT stops immediately. "HALT" is the current name - bitbake still accepts
    # "ABORT" but warns that it was renamed (monitordisk.py:79).
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},10G HALT,${TMPDIR},3G"

env:
  # The kas-container script sets this to the path of the kas config file
  # inside the container. It is used by the med-os buildstats postbuild hook to
  # name the metrics output file after the kas config, so that multiple builds
  # can be run in parallel without overwriting each other's metrics.
  # KAS_CONFIG_PATH: "/kas/kas-base.yml"
  #
  # Declared here rather than in local_conf_header so the host can override the
  # parallelism per machine (kas treats these as defaults and lets a value
  # already present in the environment win). YAML mapping syntax, not bitbake
  # assignment syntax - "KEY = value" here parses as a plain string and kas
  # rejects the file before it starts.
  BB_NUMBER_THREADS: "8"
  PARALLEL_MAKE: "-j 8"

  # The /data volume key source, as a build parameter rather than a second
  # entry point. Declared with a *null* default, which in kas means "add the
  # name to BB_ENV_PASSTHROUGH_ADDITIONS, but only set it if the host
  # environment already has it" (kas/libkas.py filters None values out before
  # handing the environment to bitbake). A string default here would be worse
  # than useless: it would land in the datastore for every machine and quietly
  # answer a question each target is supposed to answer for itself.
  #
  #   make stm32                    -> the profile's own value ("tpm2")
  #   make stm32 KEY=development    -> a key on the board's boot partition
  #
  # Two things make this work, and both were learned by getting them wrong.
  #
  # First, the project files must declare their key source with "?=", not "=".
  # bitbake imports passthrough variables into the datastore *before* it parses
  # local.conf, so a plain assignment there beats the parameter - silently, with
  # a green build and the wrong string substituted into the shipped script.
  #
  # Second, the reason this is an environment variable and not a kas overlay
  # composed onto the profile: kas emits local_conf_header blocks **sorted
  # alphabetically by key**, so an overlay named "bringup" was written to
  # local.conf *above* the profile's own "eeg-stm32mp2" block and lost to it.
  # The build succeeded, the overlay appeared to be applied, and the produced
  # .ipk still said "tpm2"; it was caught by extracting the package and reading
  # the substituted script, not by anything failing. ":forcevariable" fixed that
  # instance and left the ordering trap in place for the next one.
  MED_DATA_KEY_SOURCE:
