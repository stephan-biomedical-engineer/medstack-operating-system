header:
  version: 14
  includes:
    - kas/kas-base.yml

# meta-st-stm32mp names machines after the *board family*, not the part: the
# STM32MP257F-DK is built with MACHINE=stm32mp25-disco, which sets
# STM32MP_DT_FILES_SDCARD = "stm32mp257f-dk" and picks that device tree.
# "stm32mp257f-dk" is a device-tree name, not a machine, and bitbake's sanity
# checker rejects it outright.
machine: stm32mp25-disco

repos:
  # The analogue front-end's adjunct layer: two out-of-tree kernel modules, the
  # udev rules that name the converter, and the hat's devicetree overlay. It is
  # an ADJUNCT and not a fifth MedStack layer - see CLAUDE.md rule 1. Nothing
  # from it enters the image unless MED_EEG_LINK asks for it, which is why the
  # co-processor profile below carries the layer and installs none of it.
  meta-med-afe-ads1299:
    path: "meta-custom/meta-med-afe-ads1299"

  meta-st-stm32mp:
    url: "https://github.com/STMicroelectronics/meta-st-stm32mp.git"
    branch: "scarthgap"
    path: "layers/meta-st-stm32mp"

  # tpm2-tss is not in poky or meta-openembedded - it lives in meta-security's
  # meta-tpm sublayer, and without it the PACKAGECONFIG below makes systemd
  # (and therefore dbus, rauc and the whole image) unbuildable. Only meta-tpm
  # is selected here; meta-security proper is what implementation_plan_mac.md
  # will add for AppArmor, from this same repo. meta-tpm's LAYERDEPENDS are
  # core, openembedded-layer and meta-python, all already present.
  meta-security:
    url: "https://git.yoctoproject.org/meta-security"
    branch: "scarthgap"
    path: "layers/meta-security"
    layers:
      meta-tpm:

target:
  - med-image-eeg

local_conf_header:
  eeg-stm32mp2: |
    # The Cortex-M33 runs the acquisition firmware and publishes sample frames
    # over OpenAMP rpmsg; the service reaches them through MedicalIPC. Compare
    # with kas/project-eeg-qemu.yml: same image, same applications, same
    # framework, different front-end driver.
    #
    # This is the PRODUCT topology, and the reason it is the product one is
    # IEC 62304 §5.3: the converter belongs to the real-time core, Linux never
    # touches it, and that is what lets the Linux software item be argued into a
    # lower safety class. It is also the one with the open blocker - the M33
    # rejects unsigned firmware (BRINGUP_STM32MP2.md §9.7) - so until that is
    # solved this profile builds an image whose acquisition service cannot
    # start, and does so loudly (163 restarts, measured).
    #
    # The two alternatives, both of which produce real samples today and neither
    # of which needs signed firmware. Changing these three values is the whole
    # switch: no source, no recipe and no target changes, and the adjunct layer
    # installs exactly what each one needs.
    #
    #   hat, converter on the host's SPI6, DRDY as a real interrupt:
    #     MED_EEG_DRIVER  = "iio"
    #     MED_EEG_ADDRESS = "/dev/med-afe-eeg0"
    #     MED_EEG_LINK    = "spi"
    #   (also needs the devicetree overlay, which needs the board's chip
    #    select, DRDY and RESET pins - see ads1299-overlay_1.0.bb, which
    #    refuses to build until they are declared - and a "fdt apply" in the
    #    bootcmd, which does not exist yet.)
    #
    #   USB, converter behind an MCP2210 bridge:
    #     MED_EEG_DRIVER  = "iio"
    #     MED_EEG_ADDRESS = "/dev/med-afe-eeg0"
    #     MED_EEG_LINK    = "usb"
    #
    # They are NOT clinically equivalent to "amp" and the record says so:
    # acquisition.link travels into every session's metadata, because on "usb"
    # a sample's timestamp is when the host was told, one bus frame and one
    # wakeup after the conversion. That is an error of phase, not of date, and
    # no arithmetic downstream can undo it.
    #
    # 2026-10-07: back to "amp". The signed-firmware blocker above is gone - it
    # was the OSTL FIP's choice, and meta-st signs our firmware the way it signs
    # its own (implementation_plan_m33_firmware.md §3.3, BRINGUP_STM32MP2.md
    # §9.13-§9.14). Choosing "amp" also hands SPI6, the hat's GPIOs and DRDY's
    # EXTI line to the M33 in the OP-TEE devicetree (meta-med-afe-ads1299,
    # external-dt_%.bbappend), which reaches a board only with the FIP.
    #
    # A name, not an index: med-m33-firmware's udev rule links it to the rpmsgN
    # the M33's "rpmsg-raw" channel got, whatever N is (phase 4 of that plan).
    # The firmware is started on boot by the same package, when the m33
    # remoteproc appears.
    MED_EEG_DRIVER = "rpmsg"
    MED_EEG_ADDRESS = "/dev/med-amp0"
    MED_EEG_LINK = "amp"
    MED_EEG_REQUIRE_ENCRYPTION = "true"

    # U-Boot is what actually selects the boot slot on this SoC, and it is the
    # only backend besides barebox for which RAUC accepts boot-attempts - so
    # the try-count fallback that the A/B story depends on exists here and
    # nowhere else in this repository. The BSP also supplies its own WKS_FILE
    # (TF-A/U-Boot live at fixed offsets), which is why the bootloader cannot
    # be a distro-wide constant.
    MED_BOOTLOADER = "uboot"

    # No MED_WKS_FILE here on purpose. The disk this board needs - TF-A, FIP and
    # u-boot-env at the offsets the ROM code searches, then the same A/B slots
    # as every other MedOS machine - is declared by meta-med-bsp, keyed on
    # MACHINE. Naming the file here would work and would put a board fact in two
    # places; this file's job is to name the machine and let the adaptation layer
    # answer. Override it here only to build this machine with a different disk.

    # The only target with hardware to seal a key in. systemd-cryptenroll needs
    # systemd built with TPM2 support, which pulls tpm2-tss - weight that makes
    # no sense on the simulation profile, hence here and not in med-os.conf.
    #
    # NOT YET EXERCISED: med-data-provision.sh fails loudly on this key source
    # rather than falling back. See docs/implementation_plan_luks.md - and read
    # its §7.3 first, because sealing to PCRs that cover the rootfs means a
    # *successful* A/B update stops the device decrypting /data. Until a TPM is
    # confirmed on the board, bring the board up with
    #
    #     make stm32 KEY=development
    #
    # which puts the key on med-boot - outside both A/B slots, so a successful
    # update cannot destroy it, and ext4 rather than vfat, so the chmod 0400
    # takes effect. Whoever can read the SD card can read that key; that is what
    # makes it a development key, and why it is a parameter and not this line.
    # What the parameter does NOT waive is MED_EEG_REQUIRE_ENCRYPTION - /data is
    # a real LUKS2 volume either way, so the acquisition service starting is
    # still the assertion that encryption is real.
    #
    # "?=" rather than "=" is load-bearing: bitbake sets a passthrough variable
    # in the datastore before local.conf is parsed, so "=" here would beat the
    # parameter without failing anything. See the env: block in kas-base.yml.
    MED_DATA_KEY_SOURCE ?= "tpm2"
    PACKAGECONFIG:append:pn-systemd = " tpm2"

    # meta-tpm expects the feature it is named after, and warns once per build
    # when it is absent ("You have included the meta-tpm layer, but 'tpm or
    # tpm2' has not been enabled in your DISTRO_FEATURES"). What it actually
    # gates in the scarthgap branch is two bbappends - linux-yocto_%.bbappend
    # and linux-yocto-rt_%.bbappend, each of which is a single conditional
    # "require linux-yocto_tpm.inc" - and no PREFERRED_VERSION at all, despite
    # what the message says. Neither applies here: this machine's kernel is
    # linux-stm32mp, and the TPM config it needs comes from
    # med-kernel-features.cfg through the wildcard linux-%.bbappend, which is
    # the portable mechanism the linux-yocto-only bbappend is not.
    #
    # So this line declares intent rather than fixing a defect, and that is the
    # reason to prefer it over SKIP_META_TPM_SANITY_CHECK = "1", which would
    # silence the message without saying anything true. Blast radius checked
    # rather than assumed: in the layers this project pulls, only ovmf and
    # strongswan read this feature, and neither is built.
    #
    # It belongs here and not in med-os.conf for the same reason
    # MED_DATA_KEY_SOURCE does: qemux86-64 has no TPM, and a machine override
    # in the distro layer is precisely the layer bleeding meta-med-bsp exists
    # to prevent.
    DISTRO_FEATURES:append = " tpm2"

    # The co-processor firmware, pulled in by packagegroup-med-amp without
    # meta-med-app ever naming a machine. It installs the signed image in
    # /lib/firmware, and the unit and udev rule that start it when the M33
    # appears and name its channel /dev/med-amp0.
    MED_AMP_FIRMWARE = "med-m33-firmware"

    # ---------------------------------------------------------------------
    # A GPU deste alvo, e o que aceitar a EULA significa
    # ---------------------------------------------------------------------
    # Isto é um ato jurídico, não uma flag de build: declara que quem constrói
    # leu e aceitou a ST SLA0048 em
    # layers/meta-st-stm32mp/conf/eula/stm32mp25-disco (symlink para
    # ST_EULA_SLA), mais os termos Vivante em
    # Vivante_GPU_drivers-End_User_Software_License_Terms.txt. Sem esta linha o
    # gcnano-userland-binary.inc:50 aborta o build com bb.fatal, de propósito -
    # a ST não deixa a aceitação ser implícita, e nós também não.
    #
    # O que ela liga, em meta-st-stm32mp/conf/machine/stm32mp25-disco.conf:50-53:
    # MACHINE_FEATURES ganha gpu, openvx, opencl e vulkan, e gpu_vivante.inc
    # troca PREFERRED_PROVIDER virtual/egl (e libgles1/2/3, libgbm, virtual/mesa)
    # de mesa para gcnano-userland-multi-binary-stm32mp. Não é um pacote a mais:
    # é a pilha EGL/GLES inteira da imagem trocando de implementação, e Qt e
    # weston recompilam contra ela.
    #
    # E desliga, sozinho, o 'nogpu' que meta-med-bsp/conf/layer.conf acrescenta -
    # aquela linha é condicional a esta. O blacklist.conf da ST passa a conter só
    # "blacklist etnaviv"; o galcore proprietário fica livre para carregar.
    #
    # AINDA NÃO EXERCITADO NA PLACA, e o risco é nomeável: o pânico do mundo
    # seguro em clk_stm32_pll_init que motivou o 'nogpu' aconteceu quando um
    # driver de GPU fez bind em 48280000.gpu. Com esta linha, um driver de GPU
    # volta a fazer bind - o galcore no lugar do etnaviv. A hipótese é que o
    # stack proprietário da ST use os clocks que o firmware da ST prepara, mas
    # isso é hipótese até a placa bootar. Se voltar a reiniciar em loop, é este
    # caminho, e não o etnaviv, que precisa de investigação.
    #
    # Consequência para o SBOM (IEC 62304): entra SOUP binário de
    # redistribuição restrita na imagem. O create-spdx de med-os.conf continua
    # gerando o SBOM, mas "Proprietary" ali passa a ser um item a justificar na
    # documentação regulatória, não um detalhe de build.
    ACCEPT_EULA_stm32mp25-disco = "1"
