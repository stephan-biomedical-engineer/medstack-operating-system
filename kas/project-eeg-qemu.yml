header:
  version: 14
  includes:
    - kas/kas-base.yml

machine: qemux86-64

target:
  - med-image-eeg

local_conf_header:
  eeg-qemu: |
    # QEMU has no analogue front-end and no co-processor, so the acquisition
    # service uses the framework's synthetic EEG source. This one line is the
    # entire difference between the simulation profile and the hardware
    # profile - see kas/project-eeg-stm32mp2.yml.
    MED_EEG_DRIVER = "simulated"

    # There IS a LUKS volume now: med-data-provision.service converts the
    # med-data partition on first boot. Requiring encryption here is the
    # end-to-end test of that, and it costs nothing to run - MedicalStorage
    # resolves the device behind /data and refuses to open the store unless its
    # dm/uuid starts with CRYPT-, so a broken provisioning step stops the
    # service by itself instead of needing to be noticed.
    MED_EEG_REQUIRE_ENCRYPTION = "true"

    # No TPM on the simulation target. "development" is a real LUKS volume with
    # a device-unique random key, not an absence of encryption - what it lacks
    # is the key being sealed in hardware, so the key has to rest somewhere on
    # the device. It protects against removal of the media, not against root on
    # a running device, and the thesis should say exactly that.
    # "?=" so "make <target> KEY=..." can override it; a plain "=" would
    # beat the parameter silently (see env: in kas-base.yml).
    MED_DATA_KEY_SOURCE ?= "development"

    # "noop", not "grub", and the choice is deliberate - see
    # docs/implementation_plan_rauc.md §3. With noop, RAUC starts, enumerates
    # the A/B slots and writes the inactive one; it just does not mark anything
    # bootable. Reaching a real GRUB switch here would need grub-efi plus OVMF
    # and would still exercise the wrong mechanism: boot-attempts is rejected
    # for any backend other than uboot/barebox, so GRUB fallback on QEMU is not
    # the fallback the STM32MP257 ships. The A/B policy is validated here; the
    # bootloader integration is validated on hardware.
    MED_BOOTLOADER = "noop"
