header:
  version: 14
  includes:
    - kas/kas-base.yml

machine: qemux86-64

target:
  - med-image-eeg

local_conf_header:
  eeg-qemu: |
    # QEMU has no analogue front-end and no co-processor, so the acquisition
    # service uses the framework's synthetic EEG source. This one line is the
    # entire difference between the simulation profile and the hardware
    # profile - see kas/project-eeg-stm32mp2.yml.
    MED_EEG_DRIVER = "simulated"

    # No LUKS volume on the simulation image, so the service is told to accept
    # an unencrypted record store. It audits the fact that it was told to
    # (AuditEvent::SecurityEvent), which is why this is safe to allow here and
    # impossible to do accidentally in the field.
    MED_EEG_REQUIRE_ENCRYPTION = "false"

    # "noop", not "grub", and the choice is deliberate - see
    # docs/implementation_plan_rauc.md §3. With noop, RAUC starts, enumerates
    # the A/B slots and writes the inactive one; it just does not mark anything
    # bootable. Reaching a real GRUB switch here would need grub-efi plus OVMF
    # and would still exercise the wrong mechanism: boot-attempts is rejected
    # for any backend other than uboot/barebox, so GRUB fallback on QEMU is not
    # the fallback the STM32MP257 ships. The A/B policy is validated here; the
    # bootloader integration is validated on hardware.
    MED_BOOTLOADER = "noop"
