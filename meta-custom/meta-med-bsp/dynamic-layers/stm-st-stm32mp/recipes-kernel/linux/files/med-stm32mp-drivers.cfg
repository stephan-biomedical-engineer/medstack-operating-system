# Drivers that exist in THIS kernel tree, and nowhere else.
#
# Not a MedOS capability - meta-med-distro's med-kernel-features.cfg is where
# those live, and this symbol was there for exactly one build before the kernel
# config guard caught it: poky's linux-yocto has no TI_ADS1299 entry in its
# Kconfig, so asking for it there is a request merge_config.sh drops in silence.
#
# This fragment is applied only when MED_KERNEL_GIT points at a tree that
# contains the driver. See the bbappend next to it.
#
# "=m" and not "=y": building the module is what this fragment decides, and
# INSTALLING it stays per link, decided by MED_AFE_INSTALL_* in
# meta-med-afe-ads1299. The product profile has its converter on the
# co-processor and carries no converter driver, exactly as before.
#
# The bridge joined the converter here on 2026-09-27. It was the last
# out-of-tree module in this repository, and it existed as a second copy of a
# file that also lives in the kernel tree - two copies that had already
# diverged in one line. One source, one build.
CONFIG_TI_ADS1299=m
CONFIG_HID_MCP2210=m

# Not content, and not a MedOS capability either - the subsystem one of the two
# drivers above needs, written down here because that is where the driver is.
#
# The bridge exports its GP6 edge counter through drivers/counter, and that
# counter is the only way the USB link can know it lost samples
# (implementation_plan_afe_bench.md §5). ST's defconfig happens to set
# CONFIG_COUNTER=m, and "happens to" is exactly the accident rule 3 of CLAUDE.md
# exists for: CONFIG_DM_VERITY was free from one vendor's defconfig and absent
# from the other, and nobody noticed until a board would have failed. The
# driver's Kconfig also carries "imply COUNTER", which is the upstream half of
# the same statement; this line is the half that gets verified, because
# do_med_check_kernel_config reads the final .config.
#
# It is here and not in meta-med-distro because qemux86-64 has no bridge and
# needs no counter: a capability every machine must have belongs in the distro
# fragment, and this is not one.
CONFIG_COUNTER=m
