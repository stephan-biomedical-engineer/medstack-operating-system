# Layer configuration for meta-med-bsp (MedPlatform board adaptation)
#
# MedStack layer 1/4: everything that is true of a *board* rather than of the
# platform. Priority 7 -> above the vendor BSP layers (6), below
# meta-med-distro (8), meta-med-framework (9) and meta-med-app (10).
#
# Why this layer exists
# ---------------------
# The three layers above it are meant to contain no machine knowledge at all,
# and twice they did anyway. meta-med-distro's wic/med-partitions.wks
# hardcoded "loader=grub-efi" and "console=ttyS0,115200" behind a filename that
# looked portable, and med-image-base.bb carried QB_KERNEL_ROOT = "/dev/vda2" -
# a virtio device path plus a partition *index* from one particular disk - in a
# recipe whose own description calls it device-class agnostic. Neither failed a
# build, so neither was visible until a second machine (stm32mp25-disco) needed
# a different answer and the distro default won by forfeit, producing an
# EFI/GRUB ESP for a board that has no ESP.
#
# The distinction this layer enforces is policy vs. placement:
#
#   policy    (meta-med-distro) - two rootfs slots, identically sized, named
#                                 med-root-a/med-root-b; /data is not a slot;
#                                 the rootfs is read-only. This is the thesis.
#   placement (here)            - where TF-A lives, which bootloader reads it,
#                                 which console the kernel gets, how the
#                                 emulator finds the kernel it boots.
#
# Nothing above this layer may name a machine, a bootloader or a device node.
# When a new board arrives, this layer is the only one that gains a file - and
# that claim is what makes the portability metric enumerable rather than
# rhetorical.
#
# Direction of dependency
# -----------------------
# This layer provides and never consumes: the .wks files below are *selected*
# by MED_WKS_FILE, a variable meta-med-distro declares and reads. There is no
# bbappend here onto a recipe from a higher layer, and there must not be - that
# would invert the chain the architecture is built on. Referring to a variable
# name owned upstack is the same soft coupling as a BSP setting
# PREFERRED_PROVIDER_virtual/kernel, and is as far as it goes.

# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-bsp"
BBFILE_PATTERN_meta-med-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-bsp = "7"

# BBFILE_PATTERN_IGNORE_EMPTY was here while the layer was conf-and-data only,
# and the comment said to delete it when the layer gained its first recipe,
# naming /etc/fw_env.config for stm32mp25-disco as the one already known to be
# needed. That recipe now exists (recipes-bsp/med-uboot-env), so the opt-out is
# gone and an unmatched BBFILE_PATTERN is reported again.

LAYERVERSION_meta-med-bsp = "2"
LAYERSERIES_COMPAT_meta-med-bsp = "scarthgap"

# The constraint that matters is the one this layer exists for: it must not
# depend on the MedPlatform layers *above* it, and it does not. "core" alone
# was true while the layer shipped no recipe; med-uboot-env-config RDEPENDS on
# libubootenv-bin, which lives in meta-oe, so the declaration says so rather
# than letting a real dependency stay implicit. A config file whose tool is not
# guaranteed to be installed is a file that silently does nothing.
LAYERDEPENDS_meta-med-bsp = "core openembedded-layer"

# Optional, not required: only the STM32MP2 profile has meta-st-stm32mp in the
# stack, and the QEMU profile must keep parsing without it.
LAYERRECOMMENDS_meta-med-bsp = "stm-st-stm32mp"

# The bbappend under dynamic-layers/ is parsed only when that collection is
# present. This is not tidiness - a .bbappend for a recipe no layer provides is
# a hard parse error, which is exactly how rauc-conf_%.bbappend broke this
# build once before, and meta-med-bsp is in the layer stack of *both* profiles.
#
# Note the collection is called "stm-st-stm32mp", not "meta-st-stm32mp". A name
# that does not match any collection is silently ignored rather than reported,
# so the failure would appear two steps away, in med-uboot-env-image, as a
# missing u-boot-initial-env.
BBFILES_DYNAMIC += " \
    stm-st-stm32mp:${LAYERDIR}/dynamic-layers/stm-st-stm32mp/recipes-*/*/*.bbappend \
"

# ---------------------------------------------------------------------------
# Disk layout per machine
# ---------------------------------------------------------------------------
# wic/ needs no search path: image_types_wic looks for a "wic" subdirectory in
# every BBPATH entry, so the bare filenames below resolve to
# ${LAYERDIR}/wic/<name> on their own.
#
# The two-step indirection is the same one meta-med-distro uses for
# MED_PKI_DIR, and it is not decoration. Writing "MED_WKS_FILE:qemux86-64 =
# ..." directly would make this layer *unoverridable*: a machine-suffixed value
# beats the unsuffixed assignment a KAS project file makes, so the project file
# would silently lose. Setting a _DEFAULT per machine and then assigning it with
# "?=" keeps the precedence right - this layer answers when nobody else does,
# and local.conf (i.e. any kas project file) still wins outright.
#
# med-partitions-efi.wks was called med-partitions.wks while it lived in
# meta-med-distro. The rename is the point: it is not the platform's disk, it
# is the disk of machines that boot through GRUB/EFI.
MED_WKS_FILE_DEFAULT:qemux86-64 = "med-partitions-efi.wks"

# The STM32MP257F-DK. meta-st-stm32mp ships no WKS_FILE of its own - its
# machine conf sets WKS_FILE_DEPENDS and leaves "#WKS_FILE += ${OPTEE_WIC_FILE}"
# commented out, offering wic/sdcard-stm32mp257f-dk-optee-example.wks.in only
# as an example to copy - so this layer answers for it. Do not assume a vendor
# BSP declares its own disk; check.
MED_WKS_FILE_DEFAULT:stm32mp25-disco = "med-partitions-stm32mp2.wks.in"

MED_WKS_FILE ?= "${MED_WKS_FILE_DEFAULT}"

# ---------------------------------------------------------------------------
# How the emulator boots the disk above
# ---------------------------------------------------------------------------
# Moved out of meta-med-distro/recipes-core/images/med-image-base.bb, where an
# "an EEG boots differently from a tomograph would be a bug" comment sat two
# lines above a QEMU virtio device path. Both statements were true; they just
# belonged in different layers.
#
# runqemu's default is to treat a .wic as a self-booting VM image, which for the
# EFI/GRUB layout would mean supplying OVMF. "no-kernel-in-fs" makes it treat
# the disk as a rootfs and load the kernel directly instead, so QEMU gets a real
# partitioned disk without a bootloader being involved at all.
#
# QB_KERNEL_ROOT is coupled to med-partitions-efi.wks, which puts the ESP first
# and med-root-a second - and the coupling is now local: both lines and the file
# they describe are in this layer, so a partition inserted before the rootfs
# cannot silently invalidate a device path recorded two layers up.
#
# Conf scope rather than recipe scope is safe here, verified rather than
# assumed: nothing in poky's qemux86-64.conf or qemuboot.bbclass assigns either
# variable, so there is no later assignment to lose to. (Contrast WKS_FILE,
# which qemux86-64.conf:41 does set with "?=" - that is why med-os.conf assigns
# it with "=" from MED_WKS_FILE rather than weakly.)
QB_FSINFO:qemux86-64 = "wic:no-kernel-in-fs"
QB_KERNEL_ROOT:qemux86-64 = "/dev/vda2"

# ---------------------------------------------------------------------------
# The GPU this board has and this platform does not use
# ---------------------------------------------------------------------------
# Without this the board does not boot. The secure world panics in its clock
# driver - clk-stm32mp25.c:2002, clk_stm32_pll_init - about seven seconds into
# the kernel, immediately after "etnaviv etnaviv: bound 48280000.gpu", and the
# device reboots in a loop. Verified twice, and it survived changing the whole
# TF-A/OP-TEE/U-Boot variant, which is what ruled out a devicetree mismatch.
#
# The cause is a configuration hole in the BSP rather than a defect in it.
# meta-st's linux-stm32mp.inc writes /etc/modprobe.d/blacklist.conf only if
# MACHINE_FEATURES contains 'gpu' (blacklisting etnaviv, because the EULA was
# accepted and the proprietary galcore driver is used instead) or 'nogpu'
# (blacklisting both). With neither - no ACCEPT_EULA, no nogpu - no blacklist
# file is written at all, which is the one combination where etnaviv actually
# loads. It then binds the GPU and asks the secure world over SCMI for a PLL
# that this firmware configuration does not have prepared.
#
# 'nogpu' is the BSP's own supported way to say what is true here: this platform
# ships no GPU userspace, accepts no EULA, and the HMI, when it runs, renders in
# software. It belongs in this layer because "the board has a GPU we do not use"
# is a board fact - MACHINE_FEATURES with an ":append" applies whenever the
# variable is expanded, so it is not sensitive to layer.conf being parsed before
# the machine configuration.
#
# Conditional, and not a flat append, because the GPU is wanted later. The two
# states the BSP supports are mutually exclusive: with the EULA accepted the
# machine conf adds 'gpu' and ST's recipe blacklists etnaviv in favour of the
# proprietary galcore driver; without it, 'nogpu' blacklists both. A flat append
# here would leave both features set the day someone accepts the EULA, and they
# would have to remember to delete this line - a coupling between two files that
# nothing checks. Written this way, setting
#
#     ACCEPT_EULA_stm32mp25-disco = "1"
#
# in the KAS project file is the whole switch: 'gpu' appears, 'nogpu' does not,
# and the proprietary stack comes with it.
#
# Worth deciding deliberately rather than by default, because it is not only a
# technical choice: the Vivante stack is redistribution-restricted binary SOUP,
# which a platform arguing IEC 62304 traceability has to account for in its SBOM.
# "No GPU unless a product asks for it" is the defensible default; the EEG HMI
# does not need 3D.
MACHINE_FEATURES:append:stm32mp25-disco = "${@' nogpu' if d.getVar('ACCEPT_EULA_stm32mp25-disco') != '1' else ''}"

# The packages that make the feature real, because this image does not get them
# for free. meta-st puts the GPU driver and userland in GPU_IMAGE_INSTALL and
# appends that to MACHINE_EXTRA_RRECOMMENDS - which is pulled in by
# packagegroup-base, and med-image-base.bb installs packagegroup-core-boot
# instead. Checked, not assumed: nothing in the image's dependency graph reaches
# MACHINE_EXTRA_RRECOMMENDS, so accepting the EULA alone would give an image
# whose EGL provider is the Vivante userland with no galcore module under it -
# a build that succeeds and a compositor that fails at runtime, which is the
# failure shape this repository keeps meeting.
#
# GPU_IMAGE_INSTALL and not GPU_LIST: the ST variable is already gated on
# MACHINE_FEATURES containing 'gpu', so this is empty whenever the EULA is not
# accepted and the two states stay one switch. Expanded lazily, so layer.conf
# being parsed before the machine conf does not matter - the same argument as
# the append above.
MED_GPU_PACKAGES:stm32mp25-disco = "${GPU_IMAGE_INSTALL}"

# ---------------------------------------------------------------------------
# The U-Boot environment, and how RAUC reaches it
# ---------------------------------------------------------------------------
# RAUC's uboot backend marks a slot by calling fw_setenv, which reads
# /etc/fw_env.config. Without that file the backend fails outright - measured on
# the board 2026-08-18: "fw_printenv failed with exit code: 1", and RAUC then
# reports *every* slot as bad, including the one it just booted from, with
# "Activated: none". A rauc install would write the inactive slot and never be
# able to activate it. So this file is not a convenience; it is the whole
# bootloader half of the A/B path.
#
# ST ships u-boot-fw-config-stm32mp, which installs fw_env.config.mmc, .nand
# and .nor and never /etc/fw_env.config. Copying its .mmc into place would be
# wrong twice over - it addresses the partition by partlabel, which collides
# with the factory eMMC, and it lists both redundant copies at the same offset.
# recipes-bsp/med-uboot-env writes the file instead, and its comments carry the
# derivation.
#
# This value is the same UUID the .wks gives the partition. One declaration,
# two consumers, one layer - which is the whole argument for this layer
# existing: the partition table and the address of a partition in it are the
# same board fact and must not be able to disagree.
MED_UBOOT_ENV_PARTUUID:stm32mp25-disco = "d7ba3548-04a4-4269-aab6-913b1bc68d06"

# Size of one environment copy (CONFIG_ENV_SIZE) and of the partition holding
# the two of them. Declared here, not in either recipe, because three consumers
# have to agree and two of them are recipes: the .wks that creates the
# partition, med-uboot-env-config which tells fw_printenv where the copies are,
# and med-uboot-env-image which places them. A disagreement between any two
# produces an environment U-Boot silently discards - and a discarded
# environment boots normally, through the rescue path, which is the worst
# possible symptom because nothing looks wrong.
MED_UBOOT_ENV_SIZE:stm32mp25-disco = "0x2000"
MED_UBOOT_ENV_PART_SIZE_K:stm32mp25-disco = "512"

# U-Boot's own default environment, which med-uboot-env-image starts from and
# without which it cannot build anything: a stored environment *replaces* the
# built-in one (env_import -> himport_r without H_NOCLEAR) rather than merging,
# so an image holding only MedPlatform's variables would produce a board with no
# kernel_addr_r and no rescue path.
#
# poky generates it but only installs it into the u-boot *package*; the
# dynamic-layers bbappend beside this layer copies it to DEPLOYDIR. There are
# three, one per UBOOT_CONFIG (default_*, programmer_*), and only the one whose
# U-Boot ends up in the FIP this board boots is the right starting point.
#
# Note the subdirectory. meta-st sets
# do_deploy[sstate-outputdirs] = "${DEPLOY_DIR_IMAGE}${FIP_DIR_UBOOT}", so
# everything that task deploys - ours included - is remapped into u-boot/
# rather than landing at the top of DEPLOY_DIR_IMAGE.
MED_UBOOT_INITIAL_ENV:stm32mp25-disco = "${DEPLOY_DIR_IMAGE}/u-boot/u-boot-initial-env-default_stm32mp25"

# ---------------------------------------------------------------------------
# The two rootfs slots, addressed by PARTUUID
# ---------------------------------------------------------------------------
# Slot A's UUID is not ours: DEVICE_PARTUUID_ROOTFS:mmc0 in meta-st's
# st-machine-storage-device-stm32mp.inc declares it, and the extlinux.conf the
# BSP generates names it as root=PARTUUID=. The .wks used to repeat the literal,
# which meant the disk and the boot argument agreed by coincidence rather than
# by construction; med-uboot-env-image now fails the build if they diverge.
MED_ROOT_A_PARTUUID:stm32mp25-disco = "e91c4e10-16e6-4c0e-bd0e-77becf4a3582"

# Slot B's UUID had to be invented, and until 2026-08-30 it deliberately did not
# exist: the .wks said "slot B has no such constraint yet precisely because
# nothing boots it yet". Booting slot B by hand ended that. wic randomises an
# unspecified --uuid on every image build, so a bootcmd carrying
# root=PARTUUID=<slot B> would name a partition that stops existing at the next
# build - a kernel with no root filesystem, one image later.
MED_ROOT_B_PARTUUID:stm32mp25-disco = "35822773-a851-41e9-af87-4f6fa8e8b905"

# wic needs the environment image to exist before do_image_wic runs. Declared as
# an :append so it survives whatever the machine conf assigns afterwards -
# :append is applied after every plain assignment regardless of parse order,
# which is the same reason MACHINE_FEATURES:append above is safe here.
#
# A bare recipe name, never "name:do_deploy". WKS_FILE_DEPENDS feeds DEPENDS
# (image_types_wic.bbclass:119), which takes recipe names only, so a :task
# suffix becomes part of the name and bitbake reports "Nothing PROVIDES
# 'med-uboot-env-image:do_deploy'". What actually orders the deploy is two lines
# above it:
#
#   # We ensure all artfacts are deployed (e.g virtual/bootloader)
#   do_image_wic[recrdeptask] += "do_deploy"
#
# It is recursive over the dependency tree, so naming the recipe is enough -
# which is how meta-st gets TF-A and the FIP into DEPLOY_DIR_IMAGE before its
# own rawcopy lines read them.
WKS_FILE_DEPENDS:append:stm32mp25-disco = " med-uboot-env-image"

# Packages that only this machine needs, installed through a hook
# med-image-base.bb declares and this layer fills - the same shape as
# MED_AMP_FIRMWARE and MED_GPU_PACKAGES. The image recipe must not name a
# machine, and this layer must not edit an image recipe; a variable is where
# those two rules meet.
MED_BSP_INSTALL:stm32mp25-disco = "med-uboot-env-config"

# ---------------------------------------------------------------------------
# Where the /data volume key lives, when the key source is "development"
# ---------------------------------------------------------------------------
# The constraint comes from the update path, not from the disk: the rootfs is an
# A/B slot, so a key stored there is destroyed by the first *successful* update
# and the device loses its own patient records. The key store must be a
# partition no update writes to. Which one that is, is a partition table - a
# board fact - which is why these two answers are here and not in the script
# that reads them.
#
# med-data-provision.sh used to hardcode /dev/disk/by-partlabel/esp and
# "mount -t vfat", both of which exist only in the EFI layout. On this board
# there is no esp partition at all, and the only reason nothing failed was that
# MED_DATA_KEY_SOURCE = "tpm2" refused before reaching that code - a bug hidden
# behind a refusal.
MED_KEY_STORE_DEV:qemux86-64 = "/dev/disk/by-partlabel/esp"
MED_KEY_STORE_FSTYPE:qemux86-64 = "vfat"

# The STM32MP2 answer is med-boot: outside both A/B slots, present in
# med-partitions-stm32mp2.wks.in, and ext4 rather than vfat - so unlike the ESP
# it actually honours the chmod 0400 the script attempts. The threat model is
# unchanged and is why this is a *development* key: whoever can read the card
# can read the key. Real custody on this board is TPM2, which needs a TPM to
# exist on it and is still unexercised.
#
# It is called med-boot and not bootfs for a reason found on the device. This
# board has an eMMC holding a factory OpenSTLinux image whose partitions are
# named bootfs, rootfs, vendorfs, u-boot-env, fip-a and fip-b - and
# /dev/disk/by-partlabel/ is one flat namespace across every block device, so
# the eMMC won each colliding name by enumerating first. Measured:
# by-partlabel/bootfs pointed at mmcblk0p6, the factory eMMC, while ours was
# mmcblk1p8. Provisioning would have written the /data volume key onto the eMMC,
# appeared to work, and left the key behind the moment the card was moved to
# another board. A key store must be addressed by a name only this layout uses.
MED_KEY_STORE_DEV:stm32mp25-disco = "/dev/disk/by-partlabel/med-boot"
MED_KEY_STORE_FSTYPE:stm32mp25-disco = "ext4"

# ---------------------------------------------------------------------------
# What belongs here next, and does not live here yet
# ---------------------------------------------------------------------------
#  * ~~/etc/fw_env.config~~ - done, recipes-bsp/med-uboot-env.
#  * ~~A/B slot selection~~ - done, med-uboot-env-image plus the bootcmd it
#    carries. See docs/implementation_plan_uboot_ab.md for what it does and
#    docs/BOOT_SLOT_AB_STM32MP2.md for the measurements that specified it.
#  * A kernel that can be updated. med-boot is shared by both slots, so the A/B
#    path delivers a rootfs and never a kernel; closing that is a partition
#    table change (kernel inside the slot, or med-boot itself A/B) and
#    therefore a change to this layer.
