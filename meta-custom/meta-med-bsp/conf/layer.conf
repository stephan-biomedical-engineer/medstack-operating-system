# Layer configuration for meta-med-bsp (MedPlatform board adaptation)
#
# MedStack layer 1/4: everything that is true of a *board* rather than of the
# platform. Priority 7 -> above the vendor BSP layers (6), below
# meta-med-distro (8), meta-med-framework (9) and meta-med-app (10).
#
# Why this layer exists
# ---------------------
# The three layers above it are meant to contain no machine knowledge at all,
# and twice they did anyway. meta-med-distro's wic/med-partitions.wks
# hardcoded "loader=grub-efi" and "console=ttyS0,115200" behind a filename that
# looked portable, and med-image-base.bb carried QB_KERNEL_ROOT = "/dev/vda2" -
# a virtio device path plus a partition *index* from one particular disk - in a
# recipe whose own description calls it device-class agnostic. Neither failed a
# build, so neither was visible until a second machine (stm32mp25-disco) needed
# a different answer and the distro default won by forfeit, producing an
# EFI/GRUB ESP for a board that has no ESP.
#
# The distinction this layer enforces is policy vs. placement:
#
#   policy    (meta-med-distro) - two rootfs slots, identically sized, named
#                                 med-root-a/med-root-b; /data is not a slot;
#                                 the rootfs is read-only. This is the thesis.
#   placement (here)            - where TF-A lives, which bootloader reads it,
#                                 which console the kernel gets, how the
#                                 emulator finds the kernel it boots.
#
# Nothing above this layer may name a machine, a bootloader or a device node.
# When a new board arrives, this layer is the only one that gains a file - and
# that claim is what makes the portability metric enumerable rather than
# rhetorical.
#
# Direction of dependency
# -----------------------
# This layer provides and never consumes: the .wks files below are *selected*
# by MED_WKS_FILE, a variable meta-med-distro declares and reads. There is no
# bbappend here onto a recipe from a higher layer, and there must not be - that
# would invert the chain the architecture is built on. Referring to a variable
# name owned upstack is the same soft coupling as a BSP setting
# PREFERRED_PROVIDER_virtual/kernel, and is as far as it goes.

# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# No recipes yet - the pattern is declared so that adding one needs no edit here
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-bsp"
BBFILE_PATTERN_meta-med-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-bsp = "7"

# This layer is conf-and-data only for now: two .wks files and the variables
# that select them, no recipes. bitbake warns once per build about a collection
# whose BBFILE_PATTERN matched no .bb ("No bb files in default matched
# BBFILE_PATTERN_meta-med-bsp"), and a warning on every build is how real
# warnings stop being read. This is bitbake's own opt-out for the case
# (cooker.py:1984), not a suppression of something diagnostic.
#
# Delete this line when the layer gains its first recipe - /etc/fw_env.config
# for stm32mp25-disco is the one already known to be needed - so that a genuinely
# unmatched pattern is reported again.
BBFILE_PATTERN_IGNORE_EMPTY_meta-med-bsp = "1"

LAYERVERSION_meta-med-bsp = "1"
LAYERSERIES_COMPAT_meta-med-bsp = "scarthgap"

# "core" only, deliberately. This layer must build with any vendor BSP and must
# not depend on the MedPlatform layers above it.
LAYERDEPENDS_meta-med-bsp = "core"

# ---------------------------------------------------------------------------
# Disk layout per machine
# ---------------------------------------------------------------------------
# wic/ needs no search path: image_types_wic looks for a "wic" subdirectory in
# every BBPATH entry, so the bare filenames below resolve to
# ${LAYERDIR}/wic/<name> on their own.
#
# The two-step indirection is the same one meta-med-distro uses for
# MED_PKI_DIR, and it is not decoration. Writing "MED_WKS_FILE:qemux86-64 =
# ..." directly would make this layer *unoverridable*: a machine-suffixed value
# beats the unsuffixed assignment a KAS project file makes, so the project file
# would silently lose. Setting a _DEFAULT per machine and then assigning it with
# "?=" keeps the precedence right - this layer answers when nobody else does,
# and local.conf (i.e. any kas project file) still wins outright.
#
# med-partitions-efi.wks was called med-partitions.wks while it lived in
# meta-med-distro. The rename is the point: it is not the platform's disk, it
# is the disk of machines that boot through GRUB/EFI.
MED_WKS_FILE_DEFAULT:qemux86-64 = "med-partitions-efi.wks"

# The STM32MP257F-DK. meta-st-stm32mp ships no WKS_FILE of its own - its
# machine conf sets WKS_FILE_DEPENDS and leaves "#WKS_FILE += ${OPTEE_WIC_FILE}"
# commented out, offering wic/sdcard-stm32mp257f-dk-optee-example.wks.in only
# as an example to copy - so this layer answers for it. Do not assume a vendor
# BSP declares its own disk; check.
MED_WKS_FILE_DEFAULT:stm32mp25-disco = "med-partitions-stm32mp2.wks.in"

MED_WKS_FILE ?= "${MED_WKS_FILE_DEFAULT}"

# ---------------------------------------------------------------------------
# How the emulator boots the disk above
# ---------------------------------------------------------------------------
# Moved out of meta-med-distro/recipes-core/images/med-image-base.bb, where an
# "an EEG boots differently from a tomograph would be a bug" comment sat two
# lines above a QEMU virtio device path. Both statements were true; they just
# belonged in different layers.
#
# runqemu's default is to treat a .wic as a self-booting VM image, which for the
# EFI/GRUB layout would mean supplying OVMF. "no-kernel-in-fs" makes it treat
# the disk as a rootfs and load the kernel directly instead, so QEMU gets a real
# partitioned disk without a bootloader being involved at all.
#
# QB_KERNEL_ROOT is coupled to med-partitions-efi.wks, which puts the ESP first
# and med-root-a second - and the coupling is now local: both lines and the file
# they describe are in this layer, so a partition inserted before the rootfs
# cannot silently invalidate a device path recorded two layers up.
#
# Conf scope rather than recipe scope is safe here, verified rather than
# assumed: nothing in poky's qemux86-64.conf or qemuboot.bbclass assigns either
# variable, so there is no later assignment to lose to. (Contrast WKS_FILE,
# which qemux86-64.conf:41 does set with "?=" - that is why med-os.conf assigns
# it with "=" from MED_WKS_FILE rather than weakly.)
QB_FSINFO:qemux86-64 = "wic:no-kernel-in-fs"
QB_KERNEL_ROOT:qemux86-64 = "/dev/vda2"

# ---------------------------------------------------------------------------
# What belongs here next, and does not live here yet
# ---------------------------------------------------------------------------
#  * Key custody. med-data-provision.sh hardcodes
#    ESP=/dev/disk/by-partlabel/esp and "mount -t vfat" - a partition label and
#    a filesystem that exist only in med-partitions-efi.wks. On stm32mp25-disco
#    there is no esp partition at all, and the only reason nothing fails today
#    is that MED_DATA_KEY_SOURCE = "tpm2" refuses before reaching that code.
#    Where a device's volume key lives is a property of its disk, so it belongs
#    beside the disk. Doing it means parameterising a script that is currently
#    validated end-to-end on QEMU, so it is gated on "make check".
#
#  * /etc/fw_env.config for stm32mp25-disco. RAUC's uboot backend calls
#    fw_setenv, which reads that path; u-boot-fw-config-stm32mp installs
#    fw_env.config.mmc/.nand/.nor and never that name, so marking a slot will
#    fail on the target. Which of the three is correct is a board fact.
