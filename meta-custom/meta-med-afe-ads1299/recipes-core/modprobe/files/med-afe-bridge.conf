# MedPlatform - how the AFE board is wired to its USB-SPI bridge.
#
# The converter's chip select is on GP4 (BRINGUP_AFE.md §2.3). The pin is a
# fact of this board, so it is said here and not defaulted in the driver: the
# driver's default is GP0, which this board ties to ground, and the board
# driver refuses a pin the bridge's NVRAM does not designate as a chip select
# rather than repurposing it. Without this line the bridge comes up, the
# refusal is logged, and no converter is ever registered.
#
# The NVRAM must already designate GP4 as a chip select; that is provisioning
# (scripts/mcp2210-provision.py), and nothing on the device writes it.
#
# The status LED is on GP6, provisioned as a GPIO output that powers up on
# (BRINGUP_AFE.md §2.3.2). With led_gpio the driver blinks it at 1 Hz while
# the SPI bus is idle and holds it on while the bus is in use, so a steady LED
# means "acquiring" with the driver bound, or "no driver" without it. While
# the bus is busy the driver sends nothing to the LED; the most it costs is one
# change of level when an acquisition starts, if the LED was off at that moment.
options hid_mcp2210 spi_chip_select=4 led_gpio=6
