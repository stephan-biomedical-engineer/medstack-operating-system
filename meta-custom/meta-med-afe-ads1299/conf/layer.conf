# Layer configuration for meta-med-afe-ads1299 (ADS1299 analogue front-end)
#
# This is an ADJUNCT layer, not a fifth MedStack layer. The MedStack is four
# layers and it stays four - see CLAUDE.md rule 1 and
# docs/implementation_plan_iio_afe.md §4. Everything here is kernel code and
# board wiring that belongs to *one particular analogue front-end*, quarantined
# out of the four platform layers so that:
#
#   1. the reuse metric, which is computed over the meta-med-* layers, is not
#      contaminated by a front-end's driver;
#   2. the SBOM identifies the front-end's kernel code as one isolated item
#      (IEC 62304 §8.1.2 configuration identification);
#   3. "a new analogue front-end costs one adjunct layer and three variables,
#      and zero lines in the four platform layers" becomes a measurable
#      extensibility result rather than a claim.
#
# Priority 7, the same as meta-med-bsp: above the vendor BSP (6), below
# meta-med-distro (8). It never contends with meta-med-bsp because the two
# provide disjoint recipes; if that ever stops being true, the collision is a
# design error, not a priority problem.
#
# Direction of dependency
# -----------------------
# Like meta-med-bsp: this layer PROVIDES and never CONSUMES. There is no
# bbappend here onto a recipe from a higher layer and there must not be. It
# fills hooks the layers above already declare - MED_BSP_INSTALL for packages,
# MED_AMP_FIRMWARE for co-processor firmware - and nothing else.
#
# What is deliberately NOT here
# -----------------------------
# The name "ADS1299" and the name "MCP2210" appear in this layer and in the
# Cortex-M33 firmware, and nowhere else. That is the acceptance criterion of
# docs/implementation_plan_ads1299.md §3, and it is checkable:
#
#   grep -rn 'ADS1299\|MCP2210' meta-custom/meta-med-{app,framework,distro,bsp}
#
# must stay empty.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-afe-ads1299"
BBFILE_PATTERN_meta-med-afe-ads1299 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-afe-ads1299 = "7"

LAYERVERSION_meta-med-afe-ads1299 = "1"
LAYERSERIES_COMPAT_meta-med-afe-ads1299 = "scarthgap"

# "core", plus one thing from the platform: the AMP wire format.
#
# This layer used to depend on core alone, and the reason still holds in the
# direction that matters - no MedPlatform layer may depend on THIS one, which
# is what makes it removable and keeps the reuse figure honest. What changed on
# 2026-10-07 is that this layer now carries a producer: the Cortex-M33 firmware
# speaks the framework's AMP protocol, and it includes the one definition of
# that protocol, med-amp-abi, rather than a copy of it. A copy would be two
# definitions of a wire format with nothing to keep them equal.
#
# So the rule is "consumes only a published ABI, never code": one header-only
# recipe from meta-med-framework, the way a kernel module consumes the kernel's
# ABI. A bbappend onto a platform recipe, or a DEPENDS on one that ships code,
# is still out (implementation_plan_m33_firmware.md §5.1).
LAYERDEPENDS_meta-med-afe-ads1299 = "core meta-med-framework"

# The devicetree overlay for the hat wiring is specific to one board, so it is
# parsed only when that board's vendor layer is in the stack. Same mechanism and
# the same reason as meta-med-bsp: a recipe that references a machine's device
# tree must not be parsed for a machine that has none.
#
# The collection is "stm-st-stm32mp", not "meta-st-stm32mp" - a name that
# matches no collection is silently ignored rather than reported.
LAYERRECOMMENDS_meta-med-afe-ads1299 = "stm-st-stm32mp"

BBFILES_DYNAMIC += " \
    stm-st-stm32mp:${LAYERDIR}/dynamic-layers/stm-st-stm32mp/recipes-*/*/*.bb \
    stm-st-stm32mp:${LAYERDIR}/dynamic-layers/stm-st-stm32mp/recipes-*/*/*.bbappend \
"

# ---------------------------------------------------------------------------
# What this layer installs, and when
# ---------------------------------------------------------------------------
# The front-end has two physical links and they need different things in the
# image. Which one is in use is already declared by MED_EEG_LINK, the variable
# the acquisition service's eeg.conf carries into the clinical record - so this
# layer reads that rather than inventing a second switch:
#
#   "amp"  - the converter is on the Cortex-M33. Linux never touches it, so no
#            kernel module is installed at all; what the image needs is the
#            devicetree that hands SPI6 and the DRDY pin to the co-processor,
#            plus the firmware (MED_AMP_FIRMWARE = "med-m33-firmware", signed
#            by meta-st's own helper, BRINGUP_STM32MP2.md §9.13-§9.16).
#   "spi"  - the converter is on the hat connector and Linux drives it over
#            SPI6, with DRDY as a real interrupt. Needs the AFE driver only.
#   "usb"  - the converter is behind an MCP2210 USB-SPI bridge. Needs both
#            modules, the udev rules, and the bridge's chip select as a
#            module option (the board's wiring, not the driver's default).
#   other  - nothing.
#
# Reading a variable the layers above own is soft coupling and is as far as it
# goes; meta-med-bsp/conf/layer.conf makes the same argument for MED_WKS_FILE.
# The alternative - installing both kernel modules on every build of this
# machine - would put a USB bridge driver into a product image whose converter
# is on the co-processor, which is exactly the surface an IEC 62304 argument
# should not be carrying.
#
# Underscores and not overrides in the three names below: MED_EEG_LINK is a
# value, not an override, so "MED_AFE_INSTALL:usb" would never be selected.
# This is the same shape as MED_WKS_FILE_DEFAULT in meta-med-bsp, keyed on a
# variable instead of on MACHINE.
#
# Neither driver is a recipe of this layer any more. Both live in the Linux
# tree that is their source of truth, are enabled by the BSP's kernel fragment,
# and are packaged by kernel.bbclass under the names below. The bridge was the
# last one to move, on 2026-09-27, and it moved because the same file existed
# here and in the kernel tree and the two had already drifted apart by a line.
#
# What did NOT change is that installing them is still decided per link, which
# is the whole point of this mapping - and it is why this layer still exists
# with no kernel source in it at all.
MED_AFE_INSTALL_spi = "kernel-module-ti-ads1299"
MED_AFE_INSTALL_usb = "kernel-module-ti-ads1299 kernel-module-hid-mcp2210 med-afe-udev med-afe-modprobe"
MED_AFE_INSTALL_amp = ""
MED_AFE_INSTALL = "${@d.getVar('MED_AFE_INSTALL_' + (d.getVar('MED_EEG_LINK') or 'none')) or ''}"

# And which kernel SYMBOL each link needs, which is not the same question as
# which package it installs - and separating them is what a build proved
# necessary.
#
# The driver used to be an out-of-tree module, so a link that did not want it
# simply did not install its package and the module was never built. In-tree it
# is one of the kernel's own modules, and the image installs the kernel-modules
# metapackage, which RDEPENDS on all ~1040 of them. So the driver arrived in the
# product image, under MED_EEG_LINK = "amp", whose whole argument is that the
# converter lives on the co-processor and the Linux side carries no converter
# code. No build complained: the property died in silence and only reading the
# manifest found it.
#
# The fix is upstream of the packaging: a link that does not use the driver does
# not enable its symbol, so there is no module for kernel-modules to pull. This
# layer is where that belongs, because "which link needs which front-end" is
# exactly what it already answers; meta-med-bsp reads it and decides nothing.
MED_AFE_KCONFIG_spi = "CONFIG_TI_ADS1299"
MED_AFE_KCONFIG_usb = "CONFIG_TI_ADS1299 CONFIG_HID_MCP2210"
MED_AFE_KCONFIG_amp = ""
MED_AFE_KCONFIG_simulated = ""
MED_AFE_KCONFIG = "${@d.getVar('MED_AFE_KCONFIG_' + (d.getVar('MED_EEG_LINK') or 'none')) or ''}"

MED_BSP_INSTALL:append = " ${MED_AFE_INSTALL}"
