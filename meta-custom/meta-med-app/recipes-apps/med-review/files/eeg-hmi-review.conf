# Shipped by the reviewer's package, not by the display's: an image without a
# reviewer does not carry this file, the variable is unset, and the display
# shows no button for something the device cannot do.
#
# The spool is the one place outside its own runtime directory the display may
# write, and it is made by the path unit - hence the ordering. The "-" keeps a
# missing directory from stopping the display: no reviewer is a reason for the
# button to do nothing, never for the screen to stay dark.
[Unit]
Wants=med-review-request.path
After=med-review-request.path

[Service]
Environment=MED_REVIEW_REQUEST=/run/med-review-request/request
ReadWritePaths=-/run/med-review-request
