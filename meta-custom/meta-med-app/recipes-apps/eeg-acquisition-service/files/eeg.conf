# MedPlatform EEG acquisition parameters.
#
# Integrity protected: the recipe writes eeg.conf.sha256 next to this file at
# build time and the service refuses to start if the two disagree. Editing this
# file by hand on a device makes it unloadable - which is the point.
#
# The placeholders below are substituted at build time from the KAS project
# file. Retargeting the EEG from QEMU to the STM32MP257, or moving it from one
# physical link to another, is exactly that substitution and nothing else - no
# application source differs between them. (This comment deliberately does not
# spell the placeholder pattern out: the acceptance suite greps the shipped file
# for it, and a literal in a comment is indistinguishable from one that was
# never substituted.)
#
# A VALUE RUNS TO THE END OF ITS LINE. There are no inline comments here, and
# there must not be: MedicalConfiguration takes everything after the "=", so
# "afe.gain = 24   # PGA" makes afe.gain the string "24   # PGA", the safety
# envelope reports it as not a number and the service refuses to start. That is
# the designed behaviour - a calibration value the platform cannot parse must
# never be guessed at - and the recipe now fails the build rather than letting
# it reach a device. Put the comment on its own line, as everywhere below.

# --- front-end -------------------------------------------------------------
# "simulated" - synthetic signal generated in the framework (QEMU profile)
# "rpmsg"     - sample frames from the Cortex-M33 firmware over OpenAMP
# "iio"       - a converter the Linux kernel drives, through industrial I/O
#
# The name is the TRANSPORT, never the part. No converter part number appears
# in this file and none may: the acceptance criterion of the front-end plan is
# that grep finds none outside meta-med-bsp, the front-end's own adjunct layer
# and the co-processor firmware.
device.driver = @MED_EEG_DRIVER@
device.id = eeg0
# Meaning depends on the driver: an rpmsg endpoint, or the udev symlink that
# names the industrial I/O device. Never /dev/iio:deviceN directly - that
# number is probe order, not identity.
device.address = @MED_EEG_ADDRESS@

# --- front-end prescription ------------------------------------------------
# What this device prescribes to its front-end, in this application's own
# words. The platform does not read these keys and has no vocabulary for them:
# MedFramework knows transports, not EEG amplifiers. The safety envelope in the
# service checks them, and the recipe translates them at build time into the
# vocabulary of the link MED_EEG_LINK names - firmware keys for "amp", sysfs
# attributes of the kernel driver for "spi"/"usb", the simulated converter's
# parameters for "simulated". The result is appended at the end of this file,
# as device.option.* lines, before the file is sealed; a prescription a link
# cannot honour fails the build there instead of being dropped.
# PGA: 1, 2, 4, 6, 8, 12, 24
afe.gain = 24
# Internal reference, 4.5 V
afe.reference_uv = 4500000
afe.lead_off_detection = true
# Bias amplifier, i.e. the reference electrode
afe.bias_drive = true
# "off" or "internal". Deliberately not named after an amplitude: the generator
# swings VREF/2400, which is 1.875 mV at this reference and not the 1 mV a
# 2.4 V part would give. A configuration that leaves it on is one that is not
# measuring a patient.
afe.test_signal = off

# --- acquisition -----------------------------------------------------------
acquisition.channels = 8
# The converter offers a discrete set - 250, 500, 1000, 2000, 4000, 8000,
# 16000 - and nothing between. The safety envelope checks membership of that
# set rather than a range, because 300 is not a slightly-off request, it is an
# unimplementable one, and a device acquiring at a rate its own session
# metadata does not name is a traceability defect.
acquisition.sample_rate_hz = 250

# 14 samples per channel is 56 ms at 250 Hz, and the number comes from the
# transport rather than from taste: a stock 512-byte rpmsg buffer holds 496
# usable bytes, minus the 40-byte header and the 8-byte lead-off block leaves
# 448, which is 112 int32 samples, which is exactly 14 across 8 channels - no
# byte to spare. The USB link groups the same 14 in
# memory - there the ceiling is the transaction, not the frame - so one number
# serves both and the file does not fork per link.
acquisition.samples_per_frame = 14

# Which physical link produced this record. NOT a driver parameter: a
# declaration that goes into the clinical record, because the three links do
# not know a sample's time equally well.
#
#   simulated - there is no converter
#   amp       - the converter is on the Cortex-M33 and the timestamp is the
#               instant of conversion, taken in the data-ready interrupt
#   spi       - the converter is on the host's SPI bus with data-ready wired to
#               an interrupt; the timestamp is one SPI transfer later
#   usb       - the converter is behind a USB bridge, which cannot interrupt a
#               host at all; the timestamp is when the host was told, after a
#               bus frame and a scheduling delay
#
# The error on "usb" is one of phase, not of date, and it has to appear in the
# record rather than in a footnote.
acquisition.link = @MED_EEG_LINK@

# --- records ---------------------------------------------------------------
storage.root = /data
storage.namespace = eeg
storage.require_encryption = @MED_EEG_REQUIRE_ENCRYPTION@

# --- sample stream published to the HMI ------------------------------------
ipc.socket = /run/medplatform/eeg.sock

# --- safety envelope -------------------------------------------------------
# Checked against the limits declared in the service before acquisition is
# allowed to start; a violation stops the service instead of clamping.
#
# 500 uV is a physiological artefact threshold, and the service additionally
# checks it against what the front-end can actually represent: with gain 24 and
# a 4.5 V reference, full scale is 187500 uV, so this threshold is a clinical
# decision inside the converter's range rather than a number that happens to be
# below it. Raising the gain lowers that ceiling, and the service refuses the
# combination rather than acquiring a signal it cannot represent.
safety.max_input_uv = 500
