# The display's request spool. Writable by the "wayland" group - whoever may
# draw on the display may ask for the operator display - and not listable by
# it (0730): a request is a file left there, and nothing else is anyone's
# business. Emptied by eeg-hmi-request.service.
d /run/eeg-hmi-request 0730 root wayland -
