# A drop-in on the station desktop's unit, shipped by the display's package: an
# image without the station desktop never reads this file. The desktop runs
# with ProtectSystem=strict, which leaves /run read-only to it, and the spool is
# the one place outside its own runtime directory it may write. The "-" keeps a
# missing spool from stopping the desktop.
[Service]
ReadWritePaths=-/run/eeg-hmi-request
