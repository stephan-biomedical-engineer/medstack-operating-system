# MedPlatform infusion pump - controller parameters and drug library.
#
# Sealed at build time (a .sha256 sidecar the service verifies before it reads
# a single value), and judged by SafetyLimit before anything starts. Every
# number below is a parameter of the SIMULATED profile, chosen so that the
# acceptance suite finishes in seconds (docs/REQUISITOS_INFUSAO.md section 2).
# None of them is a clinical recommendation: the drug names and limits exist
# to exercise the dose error reduction, not to be used.
#
# Comments go on their own line: text after a value is part of the value.

# Supervision of the mechanism: heartbeat period, heartbeats the mechanism may
# miss before it rests itself, and readback silence before it is lost.
service.heartbeat_ms = 200
service.missed_heartbeats = 3
service.producer_timeout_ms = 600

# Alarms. Occlusion in mmHg; delivery tolerance as a fraction of the commanded
# flow, judged over whole windows; the longest an alarm may stay silenced.
alarm.occlusion_mmhg = 500
alarm.delivery_tolerance = 0.05
alarm.delivery_window_ms = 2000
alarm.silence_max_s = 60

# The mechanism: its sockets, its highest rate, its readback rate.
mechanism.command = /run/infusion-sim/command.sock
mechanism.data = /run/infusion-sim/data.sock
mechanism.max_rate_ml_h = 1200
mechanism.frame_rate_hz = 10

# The operator's channel, the status the command line reads, and the marker a
# restart looks for to find a therapy the last run left unfinished. The marker
# is on persistent storage on purpose: a reboot must find it too.
control.socket = /run/medplatform/infusion-control.sock
control.status = /run/medplatform/infusion-status
control.therapy_marker = /var/lib/medplatform/infusion-therapy

# Syringes: volume in mL, inner cross-section in mm^2.
syringes = 10ml, 20ml, 50ml
syringe.10ml.volume_ml = 10
syringe.10ml.area_mm2 = 165.13
syringe.20ml.volume_ml = 20
syringe.20ml.area_mm2 = 286.52
syringe.50ml.volume_ml = 50
syringe.50ml.area_mm2 = 555.72

# The drug library, with dose error reduction limits in mL/h: above the soft
# limit an operator must confirm, above the hard limit the rate is refused.
drugs = saline, heparin, insulin
drug.saline.name = Saline 0.9 percent (model)
drug.saline.soft_max_ml_h = 500
drug.saline.hard_max_ml_h = 1000
drug.heparin.name = Heparin (model)
drug.heparin.soft_max_ml_h = 30
drug.heparin.hard_max_ml_h = 50
drug.insulin.name = Insulin (model)
drug.insulin.soft_max_ml_h = 10
drug.insulin.hard_max_ml_h = 20
