# Layer configuration for meta-med-app (MedApp)
#
# MedStack layer 4/4: business logic, HMI and device profiles. Priority 10 ->
# the top of the stack. Nothing depends on this layer, which is what makes a
# new device class purely additive.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-app"
BBFILE_PATTERN_meta-med-app = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-app = "10"

LAYERVERSION_meta-med-app = "1"
LAYERSERIES_COMPAT_meta-med-app = "scarthgap"

# meta-med-framework is the only way this layer is allowed to reach the system;
# qt6-layer supplies the HMI toolkit. Note what is absent: no BSP layer, no
# machine specific dependency of any kind. That absence is the portability
# claim of the thesis, and "bitbake-layers show-depends" is where it is checked.
LAYERDEPENDS_meta-med-app = "core meta-med-framework qt6-layer"
