# MedOS - MedPlatform reference distribution policy
#
# MedStack layer 2/4 (priority 8). This file defines *what kind of operating
# system* every MedPlatform device gets, independently of the hardware below
# (BSP) and of the product above (MedFramework / MedApp).
#
# Everything here is device-class agnostic on purpose: an EEG, an infusion pump
# and a tomograph share this exact distro and differ only in their image
# recipe. That is the property the "code reuse" metric of the thesis measures.

DISTRO = "med-os"
DISTRO_NAME = "MedOS (MedPlatform Reference Distribution)"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "medplatform"
MAINTAINER = "MedPlatform TCC <stephanbrrs8@gmail.com>"

TARGET_VENDOR = "-med"
SDK_VENDOR = "-medsdk"
SDK_VERSION = "${DISTRO_VERSION}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}"

# ---------------------------------------------------------------------------
# Init system
# ---------------------------------------------------------------------------
# systemd is not a preference here, it is an architectural dependency: the
# MedFramework implements MedicalLogger on top of journald (sd-journal) and
# MedicalUpdate on top of the RAUC D-Bus API (sd-bus). INIT_MANAGER also takes
# care of adding "systemd" to DISTRO_FEATURES and of backfilling sysvinit out.
INIT_MANAGER = "systemd"

# ---------------------------------------------------------------------------
# Distro features
# ---------------------------------------------------------------------------
#   wayland/opengl -> HMI profiles (Qt/Wayland), unused by headless profiles
#   pam            -> authentication policy hooks (IEC 62304 access control)
#   seccomp        -> syscall filtering for the sandboxed medical services
#   usrmerge       -> single /usr tree, prerequisite for a clean read-only rootfs
#   polkit         -> fine grained authorization for the RAUC D-Bus interface
#   rauc           -> marks the platform as A/B updatable (consumed by BSPs)
MED_DISTRO_FEATURES = "wayland opengl pam seccomp usrmerge polkit rauc"

DISTRO_FEATURES ?= "${DISTRO_FEATURES_DEFAULT} ${MED_DISTRO_FEATURES}"

# A medical appliance has no use for these and every removed feature is
# removed attack surface.
DISTRO_FEATURES:remove = "x11 3g nfc"

# ---------------------------------------------------------------------------
# Security hardening (IEC 62304 / FDA premarket cybersecurity)
# ---------------------------------------------------------------------------
# Toolchain hardening: -fstack-protector-strong, _FORTIFY_SOURCE, full RELRO
# and PIE for every recipe that does not opt out. This is the single most
# invasive setting in this file: if a vendor BSP recipe fails to build with
# unusual flags, this is the first thing to bisect.
require conf/distro/include/security_flags.inc

# journald needs libgcrypt for FSS (Forward Secure Sealing, see
# recipes-core/systemd/systemd/10-journald-audit.conf) and cryptsetup so that
# systemd can unlock the LUKS /data volume from /etc/crypttab.
PACKAGECONFIG:append:pn-systemd = " gcrypt cryptsetup"

# The audit trail may not live on a tmpfs. OE defaults VOLATILE_LOG_DIR to
# "yes" (bitbake.conf), which selects files/fs-perms.txt and, during
# do_package, rewrites /var/log into a symlink to volatile/log - a RAM-backed
# filesystem cleared on every boot. That silently defeats Storage=persistent,
# Seal=yes and MaxRetentionSec=1year in 10-journald-audit.conf: the journal
# would be discarded at exactly the moment an incident review needs it.
#
# "no" selects files/fs-perms-persistent-log.txt instead, so /var/log stays a
# real directory and the journal survives a power cycle, as IEC 62304 5.1.1
# traceability requires. It also stops base-files and initscripts from
# creating /var/volatile/log at all.
#
# Found by the scarthgap empty-dirs QA check failing systemd's do_package_qa
# ("installs files in /var/volatile, but it is expected to be empty") - keep
# that check enabled, it is the only thing that catches this.
VOLATILE_LOG_DIR = "no"

# No package manager on the device: the only supported field mutation is a
# signed RAUC bundle applied to the inactive slot.
PACKAGE_FEED_URIS ?= ""

# ---------------------------------------------------------------------------
# Traceability (IEC 62304 configuration management)
# ---------------------------------------------------------------------------
# create-spdx  -> per-image SBOM, the artefact FDA premarket submissions ask for
# buildhistory -> package/file/size deltas between builds, and the raw data for
#                 the footprint metric of the experimental evaluation
INHERIT += "create-spdx"
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"

# ---------------------------------------------------------------------------
# Image defaults
# ---------------------------------------------------------------------------
IMAGE_FSTYPES ?= "ext4 tar.bz2"
IMAGE_LINGUAS ?= "en-us"

# Disk layout. This was "WKS_FILE ?=" on the assumption that a "?=" here loses
# only to a BSP that deliberately knows better. It does not: bitbake.conf
# includes conf/machine/${MACHINE}.conf (line 829) *before*
# conf/distro/${DISTRO}.conf (line 831), so any machine that sets WKS_FILE with
# "?=" wins - including poky's own generic qemux86-64.conf:41, which sets
# "qemux86-directdisk.wks". The result was an MBR disk with two partitions and
# no partlabels at all, instead of the A/B GPT layout, and nothing reported it:
# the image built, booted and ran. It only surfaced on inspecting the produced
# .wic with fdisk.
#
# So the assignment below stays "=", not "?=": MedOS's disk is whatever the
# machine adaptation declares, and no machine conf may take it back silently.
#
# What this file must NOT do is name the layout. It used to carry
# MED_WKS_FILE ?= "med-partitions.wks", and that default was a bootloader
# choice in disguise - the file it named hardcoded loader=grub-efi - sitting in
# the same layer where rauc-conf.bbappend spends twelve lines explaining that
# naming a bootloader here is forbidden. The default now comes from
# meta-med-bsp, keyed by machine, and a KAS project file can still override it.
# See that layer's conf/layer.conf for the policy/placement split.
WKS_FILE = "${MED_WKS_FILE}"

# ---------------------------------------------------------------------------
# Toolchain / sanity
# ---------------------------------------------------------------------------
TCLIBC ?= "glibc"
SANITY_TESTED_DISTROS ?= ""

# How many boot attempts a slot gets before the bootloader gives up on it.
# Update policy, so it is declared here - but it has two consumers in two
# layers: rauc-conf.bbappend writes it into system.conf, and meta-med-bsp bakes
# it into the U-Boot environment as the factory value of BOOT_<slot>_LEFT. A
# number that a bootloader and a userspace daemon must agree on should exist
# exactly once.
#
# Do not raise it above 9. RAUC writes the counter with "%x" and reads it with
# base 16; U-Boot's setexpr is hexadecimal while its test is decimal. Below 10
# the two bases agree and the difference cannot be seen. At 10 the value becomes
# "10", which test reads as ten and setexpr as sixteen, and nothing reports the
# disagreement.
MED_BOOT_ATTEMPTS ?= "3"
