# Layer configuration for meta-med-distro (MedOS)
#
# MedStack layer 2/4: OS policy, security hardening and kernel policy.
# Priority 8 -> above the BSP layers (6-7), below meta-med-framework (9)
# and meta-med-app (10).

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-distro"
BBFILE_PATTERN_meta-med-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-distro = "8"

LAYERVERSION_meta-med-distro = "1"
LAYERSERIES_COMPAT_meta-med-distro = "scarthgap"

# Collection names (not directory names):
#   core               -> openembedded-core (poky/meta)
#   openembedded-layer -> meta-openembedded/meta-oe
#   filesystems-layer  -> meta-openembedded/meta-filesystems (overlay/squashfs tooling)
#   rauc               -> meta-rauc, required by recipes-core/rauc/rauc-conf.bbappend
LAYERDEPENDS_meta-med-distro = "core openembedded-layer filesystems-layer rauc"

# This layer has no wic/ directory, and that absence is load-bearing. A disk
# layout has to say where the bootloader goes, which makes it a statement about
# a board; both of the layouts that used to live here are now in meta-med-bsp
# (priority 7), and med-os.conf selects one through MED_WKS_FILE without ever
# naming a file. Same reason rauc-conf.bbappend refuses to name a bootloader.

# The update-signing PKI lives at the repository root (pki/, gitignored), not
# inside a layer: private keys are not layer content. LAYERDIR is the only
# reliable anchor to the repository root that works both natively and inside
# the kas container, where the repo is bind-mounted at /repo and the build
# directory is somewhere else entirely.
#
# ":=" on the first line is required, not stylistic. With "?=" the ${LAYERDIR}
# reference would be expanded when the variable is *used* - by which point
# LAYERDIR names whatever layer bitbake happens to be parsing - instead of now.
MED_PKI_DIR_DEFAULT := "${LAYERDIR}/../../pki"
MED_PKI_DIR ?= "${MED_PKI_DIR_DEFAULT}"
