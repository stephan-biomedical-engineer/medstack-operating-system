# MedOS kernel policy fragment
#
# Distro level kernel requirements. These are the capabilities the layers
# above (MedFramework / MedApp) assume to exist on *every* MedPlatform target,
# which is why this fragment is injected through the wildcard
# linux-%.bbappend instead of a vendor specific one.

# --- Control groups v2: resource partitioning between the safety critical
# --- acquisition service and the non critical HMI (IEC 62304 segregation).
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CPUSETS=y

# --- Namespaces + seccomp: sandboxing of the medical services by systemd.
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# --- Read-only rootfs support: OverlayFS + SquashFS for the immutable image,
# --- tmpfs xattr/ACL for the volatile binds systemd creates on top of it.
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# --- Encrypted /data (LUKS) for patient and biomedical records.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_KEYS=y
CONFIG_ENCRYPTED_KEYS=y

# --- A/B update path: RAUC mounts a "verity" format bundle by stacking a
# --- dm-verity target over a loop device. Both are distro policy here, not
# --- vendor defaults to inherit.
#
# med-bundle-eeg.bb sets RAUC_BUNDLE_FORMAT = "verity" because system.conf
# declares bundle-formats=-plain, so every MedPlatform target must be able to
# mount one. That makes it a distro-level kernel requirement in exactly the
# sense this fragment exists for - and it was missing, with no build able to
# say so: linux-yocto's defconfig sets CONFIG_DM_VERITY=y, so "rauc install"
# succeeded on qemux86-64 while linux-stm32mp (# CONFIG_DM_VERITY is not set)
# would fail on the board at DM_TABLE_LOAD with "check DM_VERITY, DM_CRYPT or
# CRYPTO_AES kernel options" - rauc 1.15.2, src/dm.c:222. Same shape as the
# WKS_FILE defect: the vendor's default hid a policy we never wrote down.
#
# The verity tree is SHA-256, already required by the LUKS block above.
CONFIG_DM_VERITY=y
CONFIG_BLK_DEV_LOOP=y

# --- AMP inter-core communication (Cortex-A <-> Cortex-M), the transport
# --- behind MedicalIPC. Harmless on targets without a co-processor.
CONFIG_REMOTEPROC=y
CONFIG_RPMSG=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_CTRL=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y

# --- Industrial I/O: the kernel side of the MedicalDevice "iio" driver family
# --- (biomedical AFEs and ADCs).
#
# IIO and IIO_BUFFER were already here and were not enough, which is worth
# recording because it is the third time this shape of defect has appeared.
# Measured in the two kernels this repository builds, before the AFE work:
#
#   linux-yocto 6.6.144   (qemux86-64)     # CONFIG_IIO_KFIFO_BUF is not set
#                                          # CONFIG_IIO_TRIGGERED_BUFFER is not set
#                                          # CONFIG_SPI is not set
#                                          # CONFIG_GPIOLIB is not set
#   linux-stm32mp 6.6.129 (stm32mp2)       all four present, from ST's defconfig
#
# So an AFE driver would have built on the board and failed on QEMU with an
# undefined devm_iio_kfifo_buffer_setup - the mirror image of the
# the CONFIG_DM_VERITY defect, where linux-yocto's default hid the gap and the
# vendor kernel would have exposed it. Same lesson either way: a capability the
# layers above assume has to be written down here, or it is satisfied by
# coincidence.
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGER=y
CONFIG_IIO_KFIFO_BUF=y
CONFIG_IIO_TRIGGERED_BUFFER=y

# Deliberately NOT CONFIG_IIO_HRTIMER_TRIGGER, although
# implementation_plan_iio_afe.md §8 asks for it. That symbol depends on
# IIO_SW_TRIGGER, which depends on IIO_CONFIGFS, which needs CONFIGFS_FS - a
# writable pseudo-filesystem and a userspace step to instantiate a trigger, on
# a device whose rootfs is read only. The AFE driver carries its own timer for
# the link that has no interrupt, so nothing would bind the standalone trigger;
# the plan named the mechanism before the driver existed to say it was not
# needed.

# --- SPI, and why it is back.
#
# implementation_plan_ads1299.md §7.8 removed CONFIG_SPI from this fragment,
# correctly: at the time neither link put a SPI master on the Linux side - the
# hat gave the bus to the Cortex-M33 and the USB bridge was to be driven from
# userspace - so it would have been a capability nothing consumed. That section
# also said the item comes back "with the driver", and it now has: both AFE
# links terminate in an in-kernel SPI device, one on the SoC's own controller
# and one on the controller a USB bridge driver registers.
#
# GPIOLIB comes with it. The bridge exports its nine general purpose pins as a
# gpiochip, and the hat's chip select and RESET are ordinary GPIOs because the
# SPI6 pin group carries no NSS.
CONFIG_SPI=y
CONFIG_GPIOLIB=y

# --- USB HID: the transport of the USB link's bridge.
#
# Both kernels already have these, from their vendor defaults, and that is
# exactly why they are declared here. NOT CONFIG_HIDRAW: an earlier revision of
# the plan needed it for a userspace bridge over /dev/hidraw*, and that design
# was superseded by a kernel driver. Nothing in this platform opens a raw HID
# device, so the symbol stays off and the surface with it.
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y

# A note on writing comments in this file, learned from a warning: in a .cfg
# fragment "# CONFIG_X is not set" is SYNTAX, not a comment, so a prose line that
# begins with "# CONFIG_" is read by kernel-yocto's do_kernel_configcheck as a
# badly formatted option. Name a symbol mid-sentence, never at the start of a
# comment line.
#
# --- The analogue front-end's driver is deliberately NOT here.
#
# The symbol CONFIG_TI_ADS1299 was in this fragment for one build, and that
# build failed on qemux86-64 with the guard below saying "asked for and not
# present". The
# finding is worth more than the line was:
#
# This fragment declares CAPABILITIES that any kernel has - cgroups, verity,
# IIO, SPI, HID. CONFIG_TI_ADS1299 is not a capability, it is CONTENT: the
# symbol exists only because the driver was added to the Kconfig of one
# particular tree, the fork of ST's kernel that is the driver's source of truth.
# poky's linux-yocto has no such entry, so merge_config.sh drops the request in
# silence - which is exactly the class of defect the guard exists to make
# audible, and it made it audible on the first run.
#
# So the declaration lives where the tree is known, in
# meta-med-bsp/dynamic-layers/stm-st-stm32mp/recipes-kernel/linux/, applied only
# when MED_KERNEL_GIT points at a tree that actually contains the driver.
#
# The consequence, declared rather than discovered later: an out-of-tree module
# built against any kernel, an in-tree driver exists only in the tree that has
# it. The spi and usb links are therefore buildable on the machine whose kernel
# we control and not on qemux86-64, where the profile is "simulated" and needs
# no converter driver at all.

# --- Regmap, which this fragment cannot actually guarantee.
#
# Listed because the AFE driver needs it, and flagged because CONFIG_REGMAP has
# no Kconfig prompt: it is "default y if (REGMAP_I2C || REGMAP_SPI || ...)" and
# is selected by drivers, never set by a fragment. Both current kernels have it
# for unrelated reasons. An out-of-tree module cannot select it, so the honest
# mechanism is detection, not declaration - the module recipes in
# meta-med-afe-ads1299 fail the build when it is missing, which is the check
# this line is not.
CONFIG_REGMAP=y

# --- Audit trail and integrity (IEC 62304 traceability).
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_INTEGRITY=y
CONFIG_FANOTIFY=y

# --- Watchdog: mandatory for an unattended life-adjacent appliance; systemd
# --- drives it through RuntimeWatchdogSec.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_SYSFS=y

# --- TPM: custódia de chave do volume /data no alvo físico.
#
# Distro-wide, não por máquina, e isso é deliberado: sem dispositivo TPM
# presente os drivers simplesmente não ligam, então o custo no QEMU são alguns
# KB de kernel. Um fragmento por máquina seria justamente o acoplamento a BSP
# que a regra 3 do CLAUDE.md existe para evitar.
#
# A implementação da fonte de chave "tpm2" ainda não existe - ver
# docs/implementation_plan_luks.md §5. Estas opções entram antes dela para que o
# kernel do alvo físico não precise de um segundo ciclo de build.
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_CORE=y
CONFIG_TCG_TIS=y
CONFIG_HW_RANDOM_TPM=y
