# MedOS kernel policy fragment
#
# Distro level kernel requirements. These are the capabilities the layers
# above (MedFramework / MedApp) assume to exist on *every* MedPlatform target,
# which is why this fragment is injected through the wildcard
# linux-%.bbappend instead of a vendor specific one.

# --- Control groups v2: resource partitioning between the safety critical
# --- acquisition service and the non critical HMI (IEC 62304 segregation).
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CPUSETS=y

# --- Namespaces + seccomp: sandboxing of the medical services by systemd.
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# --- Read-only rootfs support: OverlayFS + SquashFS for the immutable image,
# --- tmpfs xattr/ACL for the volatile binds systemd creates on top of it.
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y

# --- Encrypted /data (LUKS) for patient and biomedical records.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_KEYS=y
CONFIG_ENCRYPTED_KEYS=y

# --- A/B update path: RAUC mounts a "verity" format bundle by stacking a
# --- dm-verity target over a loop device. Both are distro policy here, not
# --- vendor defaults to inherit.
#
# med-bundle-eeg.bb sets RAUC_BUNDLE_FORMAT = "verity" because system.conf
# declares bundle-formats=-plain, so every MedPlatform target must be able to
# mount one. That makes it a distro-level kernel requirement in exactly the
# sense this fragment exists for - and it was missing, with no build able to
# say so: linux-yocto's defconfig sets CONFIG_DM_VERITY=y, so "rauc install"
# succeeded on qemux86-64 while linux-stm32mp (# CONFIG_DM_VERITY is not set)
# would fail on the board at DM_TABLE_LOAD with "check DM_VERITY, DM_CRYPT or
# CRYPTO_AES kernel options" - rauc 1.15.2, src/dm.c:222. Same shape as the
# WKS_FILE defect: the vendor's default hid a policy we never wrote down.
#
# The verity tree is SHA-256, already required by the LUKS block above.
CONFIG_DM_VERITY=y
CONFIG_BLK_DEV_LOOP=y

# --- AMP inter-core communication (Cortex-A <-> Cortex-M), the transport
# --- behind MedicalIPC. Harmless on targets without a co-processor.
CONFIG_REMOTEPROC=y
CONFIG_RPMSG=y
CONFIG_RPMSG_VIRTIO=y
CONFIG_RPMSG_CHAR=y
CONFIG_RPMSG_CTRL=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y

# --- Industrial I/O: the kernel side of the MedicalDevice "iio" driver family
# --- (biomedical AFEs and ADCs).
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGER=y

# --- Audit trail and integrity (IEC 62304 traceability).
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_INTEGRITY=y
CONFIG_FANOTIFY=y

# --- Watchdog: mandatory for an unattended life-adjacent appliance; systemd
# --- drives it through RuntimeWatchdogSec.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_SYSFS=y

# --- TPM: custódia de chave do volume /data no alvo físico.
#
# Distro-wide, não por máquina, e isso é deliberado: sem dispositivo TPM
# presente os drivers simplesmente não ligam, então o custo no QEMU são alguns
# KB de kernel. Um fragmento por máquina seria justamente o acoplamento a BSP
# que a regra 3 do CLAUDE.md existe para evitar.
#
# A implementação da fonte de chave "tpm2" ainda não existe - ver
# docs/implementation_plan_luks.md §5. Estas opções entram antes dela para que o
# kernel do alvo físico não precise de um segundo ciclo de build.
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS_CORE=y
CONFIG_TCG_TIS=y
CONFIG_HW_RANDOM_TPM=y
