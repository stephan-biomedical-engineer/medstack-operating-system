# Símbolos de KERNEL que existem para a bancada, e que NÃO podem entrar numa
# imagem de produto.
#
# Este arquivo é aplicado apenas quando MED_BENCH = "1". Nunca por padrão, e o
# bbappend ao lado falha o build se alguém o pedir junto de med-image-prod.
#
# --- CONFIG_SPI_SPIDEV
#
# A Fase 2 do implementation_plan_afe_bench.md mede a máquina de estados de
# transferência da ponte com um jumper MOSI/MISO e SEM o conversor, para que um
# byte errado ali tenha uma causa possível em vez de duas. Isso exige um
# consumidor de userspace do barramento.
#
# E um /dev/spidevX.Y é exatamente o que a arquitetura fecha: um caminho de
# userspace para o barramento do conversor, contornando o MedFramework e a
# regra 1 do CLAUDE.md. Ele é aceitável numa placa de bancada com um jumper no
# lugar do paciente, e em nenhuma outra circunstância.
#
# O plano registra a alternativa que foi recusada: fazer o loopback com o
# próprio ti-ads1299 lendo o registrador de ID e comparando com o eco. Ela
# dispensa o spidev e reintroduz duas variáveis - a ponte e o conversor - que é
# precisamente o que esta fase existe para separar.
CONFIG_SPI_SPIDEV=m
