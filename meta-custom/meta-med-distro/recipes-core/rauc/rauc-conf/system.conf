# MedOS RAUC system configuration - A/B (dual copy) update layout.
#
# Regulatory rationale (IEC 62304 5.8 / FDA premarket cybersecurity): a field
# update must be atomic and reversible. The running slot is never modified;
# the bundle is written to the inactive slot, verified against the keyring and
# only then marked bootable. A failed boot falls back to the previous slot,
# so an interrupted update can never leave a device unbootable.
#
# @MED_COMPATIBLE@ / @MED_VERSION@ are substituted at build time by
# rauc-conf_%.bbappend.

[system]
compatible=@MED_COMPATIBLE@
bootloader=uboot
bundle-formats=-plain
data-directory=/data/rauc
max-bundle-download-size=536870912

[keyring]
path=/etc/rauc/keyring.pem
# Reject bundles signed by a certificate that was valid at signing time but has
# since been revoked.
check-crl=true

[handlers]
# Optional integrator hooks (pre/post install). Left unset: the default
# behaviour is a plain slot write, which is what the PoC needs.

[slot.rootfs.0]
device=/dev/disk/by-partlabel/med-root-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/med-root-b
type=ext4
bootname=B

# /data is deliberately NOT a slot: patient records, calibration tables and the
# audit trail survive updates untouched. MedicalStorage and MedicalConfiguration
# are the only writers.
