# MedOS RAUC system configuration - A/B (dual copy) update layout.
#
# Regulatory rationale (IEC 62304 5.8 / FDA premarket cybersecurity): a field
# update must be atomic and reversible. The running slot is never modified;
# the bundle is written to the inactive slot, verified against the keyring and
# only then marked bootable. A failed boot falls back to the previous slot,
# so an interrupted update can never leave a device unbootable.
#
# @MED_COMPATIBLE@ / @MED_VERSION@ / @MED_BOOTLOADER@ are substituted at build
# time by rauc-conf.bbappend, which fails the build if any placeholder is left
# behind.

[system]
compatible=@MED_COMPATIBLE@

# Machine property, not distro policy: qemux86-64 boots through GRUB/EFI and
# the STM32MP257 through U-Boot, so the value comes from the KAS project file
# (MED_BOOTLOADER) exactly the way the acquisition front-end does. This file
# used to hardcode "uboot" while the layout file beside it (then
# med-partitions.wks, now meta-med-bsp/wic/med-partitions-efi.wks) documented
# itself as
# targeting EFI/GRUB machines - a contradiction inside one layer that no build
# could detect, because nothing reads both until a device boots.
bootloader=@MED_BOOTLOADER@
bundle-formats=-plain

# How many boot attempts a slot gets. Both are RAUC's own defaults
# (UBOOT_DEFAULT_ATTEMPTS / UBOOT_ATTEMPTS_PRIMARY, src/bootloaders/uboot.c),
# written down because the U-Boot bootcmd in meta-med-bsp depends on the value
# and a number two components must agree on should not exist only as one of
# their implicit defaults. "boot-attempts" is what rauc mark-good restores;
# "boot-attempts-primary" is what an install gives the slot it just wrote.
#
# Do not raise these above 9. RAUC writes the counter with "%x" and reads it
# with base 16; U-Boot's setexpr is hexadecimal and its test is decimal. Below
# 10 the two bases agree and the difference is invisible. At 10 the value
# becomes "10", which test reads as ten and setexpr as sixteen, and the
# disagreement is silent.
#
# Substituted by rauc-conf.bbappend, and it substitutes to *nothing* unless the
# bootloader is uboot or barebox. That is not tidiness: RAUC refuses to load a
# configuration that sets either key for any other backend -
# "Configuring boot attempts is valid for uboot or barebox only (not for noop)",
# src/config_file.c:393 - so a hardcoded value here would stop rauc.service on
# qemux86-64, where MED_BOOTLOADER is "noop". This file is shared by every
# target; a line that is valid on only one of them has to be conditional.
@MED_BOOT_ATTEMPTS@
data-directory=/data/rauc
max-bundle-download-size=536870912

[keyring]
# Must name the file rauc-conf.bb actually installs, which is
# ${RAUC_KEYRING_FILE} under /etc/rauc - set to med-keyring.pem by
# rauc-conf.bbappend. The file is the MedPlatform root CA concatenated with a
# CRL; scripts/med-pki.sh generates both and keeps the private keys out of the
# repository.
path=/etc/rauc/med-keyring.pem

# Reject bundles signed by a certificate that was valid at signing time but has
# since been revoked. Note that this makes OpenSSL demand a CRL for every
# certificate in the chain - a keyring holding only the CA certificate would
# fail every verification with "unable to get certificate CRL", which is why
# the CRL is part of the keyring file.
check-crl=true

# Enforce that the signing certificate is a code-signing certificate.
#
# This is not belt-and-braces, it is load-bearing: RAUC registers its own X509
# purpose ("codesign-rauc") and only installs it when this key is present.
# Without it, OpenSSL's CMS verification falls back to the smime_sign purpose,
# which rejects any certificate whose extended key usage is codeSigning - so
# omitting this line would make the *correctly issued* certificate the reason
# bundle verification fails. See scripts/med-pki.sh.
check-purpose=codesign

[handlers]
# Optional integrator hooks (pre/post install). Left unset: the default
# behaviour is a plain slot write, which is what the PoC needs.

[slot.rootfs.0]
device=/dev/disk/by-partlabel/med-root-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/med-root-b
type=ext4
bootname=B

# /data is deliberately NOT a slot: patient records, calibration tables and the
# audit trail survive updates untouched. MedicalStorage and MedicalConfiguration
# are the only writers.
