# MedOS journald policy - the storage backend of MedicalLogger.
#
# IEC 62304 5.1.1 / FDA traceability: the event trail of a medical device has
# to be persistent, bounded (it must never fill the disk and take the device
# down) and detectably tampered with.
[Journal]

# Survive reboots. /var/log/journal is created at image build time by the
# systemd bbappend because the rootfs is read-only in production.
Storage=persistent

# Forward Secure Sealing. journald periodically seals the journal with a key
# that is then discarded, so any retroactive edit of an already sealed range is
# detectable with "journalctl --verify --verify-key=". Requires the gcrypt
# PACKAGECONFIG, which med-os.conf enables. This is the OS half of the tamper
# evidence; the application half is the hash chain MedicalLogger maintains per
# record.
#
# This line alone seals nothing: journald seals only when a sealing key exists
# in the journal directory, and for two months none did (RESULTS.md section 5,
# correction of 2026-11-02). med-journal-seal.service creates it on the first
# boot of each machine-id and hands the verification key over once.
Seal=yes
SplitMode=none

# Bounded growth: a device that stops acquiring because its log filled up is a
# safety problem, not a logging problem.
SystemMaxUse=256M
SystemKeepFree=64M
SystemMaxFileSize=32M
MaxRetentionSec=1year
MaxFileSec=1week

# Never silently drop audit records under load.
RateLimitIntervalSec=0
RateLimitBurst=0

# Nothing forwards off-device by default; export is an explicit, audited action.
ForwardToSyslog=no
ForwardToWall=no
ForwardToConsole=no

# Keep kernel messages (remoteproc / rpmsg / dm-crypt) in the same trail as the
# application records so a post-incident review has one timeline.
Audit=yes
