# meta-med-host - ADJUNCT layer, not a fifth MedStack layer.
#
# The EEG profile's userspace run as a container on a general-purpose Linux
# host (an Ubuntu PC), instead of as a whole operating system on a board. The
# host supplies what a board's BSP would: the kernel, the front-end's kernel
# modules, the udev rule that names the converter, and a display. Everything
# above that - the framework, the service, the sealed configuration, the HMI,
# the units and their sandboxes - is the image the other profiles build.
#
# Like meta-med-desktop it holds the content of one *profile*, so it is not
# counted in the reuse metric. Unlike the other two adjuncts it consumes: its
# image requires med-image-eeg from meta-med-app, because the point of the
# profile is to be that image, minus what a host already is.
BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-host"
BBFILE_PATTERN_meta-med-host = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-host = "7"
LAYERVERSION_meta-med-host = "1"
LAYERSERIES_COMPAT_meta-med-host = "scarthgap"
LAYERDEPENDS_meta-med-host = "core meta-med-app"
