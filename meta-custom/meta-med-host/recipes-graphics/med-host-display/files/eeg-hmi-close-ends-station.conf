# On a desktop PC the operator display is the station: the station is opened
# from the menu, and closing its display has to put the front-end back to rest
# rather than leave it converting behind a closed window (seen 2026-10-28: the
# board went on acquiring after Close). So when the display quits by its own
# Close - exit status 0, nothing else - the container powers itself off, the
# acquisition service stops on the way down, and the next click on the icon
# starts it again.
#
# A crash (non-zero) is restarted by the unit as before, and a stop requested
# from outside (EXIT_CODE=killed) is left alone. The HMI's Close is not offered
# while a session is recording, so this never ends a recording by itself.
#
# "+" because the display's own sandbox (PrivateNetwork, a syscall filter) is
# about drawing, not about asking init to halt.
[Service]
ExecStopPost=+/bin/sh -c 'if [ "$EXIT_CODE" = exited ] && [ "$EXIT_STATUS" = 0 ]; then exec /usr/bin/systemctl poweroff --no-block; fi'
