# MedPlatform station: the file manager's defaults.
#
# Read when the user has no profile of its own, which is every start: the
# desktop user's home is a runtime directory and is empty at boot.

[System]
# The theme this image carries. The program's own default names one that is
# not installed, and draws every file as an empty square.
FallbackIconThemeName=Adwaita
# Nothing here is run as another user, opened in a terminal or unpacked.
SuCommand=
Terminal=
Archiver=

[Behavior]
# No trash: everything this user can reach is read-only, and a trash can that
# always fails is worse than none.
UseTrash=false
ConfirmDelete=true
SingleClick=false
# A launcher on the desktop runs on a double click, without the "execute?"
# question. The file manager would otherwise ask every time: it trusts a
# launcher only through a metadata store this image does not have. What this
# also allows - running a program found while browsing - reaches nothing the
# task bar's own launcher cannot: same user, same read-only view, no network.
QuickExec=true

[Desktop]
# A flat colour, the one the operator display is drawn on. No wallpaper: an
# image behind a medical display is decoration, and it is one more file.
WallpaperMode=none
BgColor=#1b2430
FgColor=#e6edf3
ShadowColor=#0b0f14
# None of the stock shortcuts: no trash, no "computer", no network exist here.
DesktopShortcuts=
ShowHidden=false

[Volume]
# There is no volume daemon on this device, and the desktop has no right to
# mount anything.
MountOnStartup=false
MountRemovable=false
AutoRun=false

[Places]
HiddenPlaces=computer:///, network:///, trash:///, menu://applications/, /run/med-desktop/home/Desktop

[Window]
RememberWindowSize=false
FixedWidth=1000
FixedHeight=640
