# meta-med-desktop - ADJUNCT layer: the station's desktop environment.
#
# Not a fifth MedStack layer, and not counted in the reuse metric, for the same
# reason the analogue front-end's layer is not: this is the content of one
# profile - a bench station with a task bar and a file manager - and none of
# the four platform layers needs it to exist. It provides and consumes nothing
# above it. docs/implementation_plan_desktop.md is the plan, and its section 1
# is why this is a wlroots compositor and not a larger desktop.
#
# Everything here is third-party software packaged unmodified, and each recipe
# is SOUP this repository has taken on the maintenance of. That is a cost, and
# it is why the list is as short as it is.

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-desktop"
BBFILE_PATTERN_meta-med-desktop = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-desktop = "7"

LAYERVERSION_meta-med-desktop = "1"
LAYERSERIES_COMPAT_meta-med-desktop = "scarthgap"

# openembedded-layer for hwdata, which the compositor library reads monitor
# names from at build time.
LAYERDEPENDS_meta-med-desktop = "core openembedded-layer"
