# Layer configuration for meta-med-framework (MedFramework)
#
# MedStack layer 3/4: the C++ abstraction boundary between medical
# applications and the operating system. Priority 9 -> above meta-med-distro
# (8), below meta-med-app (10).

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-med-framework"
BBFILE_PATTERN_meta-med-framework = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-med-framework = "9"

LAYERVERSION_meta-med-framework = "1"
LAYERSERIES_COMPAT_meta-med-framework = "scarthgap"

# The dependency on meta-med-distro is architectural, not incidental: the
# framework is implemented on top of the OS policy that layer defines
# (journald with FSS for MedicalLogger, the RAUC D-Bus service for
# MedicalUpdate, the LUKS /data volume for MedicalStorage). Declaring it here
# is what makes "bitbake-layers show-depends" prove the stack is acyclic and
# unidirectional.
LAYERDEPENDS_meta-med-framework = "core meta-med-distro"
